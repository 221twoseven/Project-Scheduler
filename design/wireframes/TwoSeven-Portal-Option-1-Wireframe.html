<!DOCTYPE html>

<title>TwoSeven — Portal · Option 1 wireframe</title>
<meta name="description" content="Standalone interactive review wireframe. Fictional data; no live connections. Changes reset when reloaded.">

<body>
<script>
// Inline icon renderer: no CDN, package, or network request required.
const embeddedIcons = {"users": "<path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2m20 0v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/>", "calendar-days": "<rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"/><path d=\"M16 3v4M8 3v4M3 11h18M8 15h.01M12 15h.01M16 15h.01M8 18h.01M12 18h.01\"/>", "calendar-range": "<rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"/><path d=\"M16 3v4M8 3v4M3 11h18M8 16h8\"/>", "network": "<rect x=\"9\" y=\"2\" width=\"6\" height=\"6\" rx=\"1\"/><rect x=\"2\" y=\"16\" width=\"6\" height=\"6\" rx=\"1\"/><rect x=\"16\" y=\"16\" width=\"6\" height=\"6\" rx=\"1\"/><path d=\"M12 8v4M5 16v-4h14v4\"/>", "clipboard-check": "<rect x=\"5\" y=\"4\" width=\"14\" height=\"18\" rx=\"2\"/><rect x=\"9\" y=\"2\" width=\"6\" height=\"4\" rx=\"1\"/><path d=\"m9 14 2 2 4-4\"/>", "clipboard-list": "<rect x=\"5\" y=\"4\" width=\"14\" height=\"18\" rx=\"2\"/><rect x=\"9\" y=\"2\" width=\"6\" height=\"4\" rx=\"1\"/><path d=\"M9 12h.01M12 12h3M9 16h.01M12 16h3\"/>", "settings": "<path d=\"m9 3 1-1h4l1 3 3 1 3 1v4l-2 1v3l2 2-2 3-3-1-2 2h-4l-1-3-3-1-3-1v-4l2-1V9L3 7l2-3 3 1Z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/>", "building-2": "<rect x=\"4\" y=\"2\" width=\"12\" height=\"20\" rx=\"1\"/><path d=\"M16 8h4v14H4M8 6h4M8 10h4M8 14h4M9 22v-4h2v4\"/>", "contact": "<rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"/><circle cx=\"12\" cy=\"9\" r=\"3\"/><path d=\"M7 19v-1a5 5 0 0 1 10 0v1\"/>", "chart-no-axes-combined": "<path d=\"M3 17v4M8 13v8M13 16v5M18 10v11M3 11l5-6 5 4 8-7M17 2h4v4\"/>", "wrench": "<path d=\"M14 6a5 5 0 0 0-6 6L2 18a3 3 0 0 0 4 4l7-7a5 5 0 0 0 7-7l-4 4-4-4 4-4Z\"/>", "receipt-text": "<path d=\"M4 3 6 5l2-2 2 2 2-2 2 2 2-2 2 2 2-2v18l-2-2-2 2-2-2-2 2-2-2-2 2-2-2-2 2V3ZM8 9h8M8 13h8M8 17h4\"/>", "grid-2x2": "<rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"/>", "search": "<circle cx=\"10\" cy=\"10\" r=\"7\"/><path d=\"m15 15 6 6\"/>"};
globalThis.lucide = { createIcons() {
 document.querySelectorAll('i[data-lucide]').forEach(node => {
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  for (const [key,value] of Object.entries({viewBox:'0 0 24 24',width:'16',height:'16',fill:'none',stroke:'currentColor','stroke-width':'1.5','stroke-linecap':'round','stroke-linejoin':'round','aria-hidden':'true',focusable:'false'})) svg.setAttribute(key,value);
  svg.innerHTML = embeddedIcons[node.dataset.lucide] || embeddedIcons['grid-2x2'];
  node.replaceWith(svg);
 });
}};
</script>
<div id="ts-portal-options">
<div class="viz-carousel" aria-label="TwoSeven portal wireframes">
<section data-variant="1 · App launcher" aria-label="App launcher portal"><div class="ts-product" data-design="launcher"></div></section>
</div>
<style>

#ts-portal-options .ts-product .app-row:hover{color:var(--blue)}

#ts-portal-options .ts-product .app-row small{display:block;font-size:11px;color:var(--dim)}
#ts-portal-options .ts-product .work-card{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:20px;margin-bottom:16px}

#ts-portal-options .ts-product .task-row .task-copy{flex:1}
#ts-portal-options .ts-product .task-row small{display:block;color:var(--dim);font-size:11px;margin-top:4px}
#ts-portal-options .ts-product .search{display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--panel);border:1px solid var(--line);border-radius:8px;margin:20px 0 12px}
#ts-portal-options .ts-product .search input{width:100%;border:0;background:transparent;color:var(--ink);outline:0;font-size:15px}
#ts-portal-options .ts-product .search input::placeholder{color:var(--dim)}
#ts-portal-options .ts-product .directory-head,#ts-portal-options .ts-product .directory-row{display:grid;grid-template-columns:minmax(140px,1fr) minmax(220px,2fr) 110px;gap:16px;align-items:center}
#ts-portal-options .ts-product .directory-head{font-size:11px;color:var(--dim);padding:10px 14px;background:var(--soft);border-bottom:1px solid var(--line)}
#ts-portal-options .ts-product .directory-row{width:100%;color:var(--ink);background:var(--panel);border:0;border-bottom:1px solid var(--line);padding:16px 14px;text-align:left}
#ts-portal-options .ts-product .directory-row:hover{background:var(--tint)}
#ts-portal-options .ts-product .directory-row .app-head{font-size:13px}
#ts-portal-options .ts-product .directory-row .description{font-size:12px;color:var(--dim)}
#ts-portal-options .ts-product .directory-row .launch{font-size:12px;color:var(--blue);text-align:right}
#ts-portal-options .ts-product .switcher{position:absolute;right:68px;top:51px;background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:0 6px 18px #0d131d30;border-radius:8px;padding:8px 16px;width:265px;z-index:4}
#ts-portal-options .ts-product .overlay{position:absolute;inset:56px 0 0;z-index:5;background:var(--paper);padding:26px 32px}
#ts-portal-options .ts-product .destination{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:24px;margin-top:22px}
#ts-portal-options .ts-product .destination h2{font-size:20px}
#ts-portal-options .ts-product .destination .placeholder{border-top:1px solid var(--line);padding-top:18px;margin-top:20px;color:var(--dim)}
@media(max-width:760px){#ts-portal-options .ts-product .main{padding:24px 20px}#ts-portal-options .ts-product .app-grid{grid-template-columns:repeat(2,minmax(0,1fr))}#ts-portal-options .ts-product .split{grid-template-columns:190px 1fr;gap:20px}#ts-portal-options .ts-product .work-top{align-items:flex-start;flex-direction:column}#ts-portal-options .ts-product .directory-head,#ts-portal-options .ts-product .directory-row{grid-template-columns:140px 1fr}#ts-portal-options .ts-product .directory-head span:last-child{display:none}#ts-portal-options .ts-product .directory-row .launch{grid-column:2;text-align:left}#ts-portal-options .ts-product{min-height:900px}}
@media(max-width:500px){#ts-portal-options .ts-product{min-height:1350px}#ts-portal-options .ts-product .top{gap:8px;padding:0 12px}#ts-portal-options .ts-product .brand{font-size:11px;letter-spacing:.1em;padding-right:10px}#ts-portal-options .ts-product .top-name{display:none}#ts-portal-options .ts-product .intro{align-items:flex-start;flex-direction:column}#ts-portal-options .ts-product .app-grid,#ts-portal-options .ts-product .recent,#ts-portal-options .ts-product .split{grid-template-columns:1fr}#ts-portal-options .ts-product .app-link{min-height:125px}#ts-portal-options .ts-product .app-description{min-height:0}#ts-portal-options .ts-product .directory-head{display:none}#ts-portal-options .ts-product .directory-row{grid-template-columns:1fr;gap:8px}#ts-portal-options .ts-product .directory-row .launch{grid-column:1}#ts-portal-options .ts-product .footer{flex-wrap:wrap}#ts-portal-options .ts-product .task-row{flex-wrap:wrap}#ts-portal-options .ts-product .switcher{right:10px}}
</style>
<script>
(()=>{
const root=document.getElementById('ts-portal-options');
const apps=[
{name:'Timeline',icon:'calendar-range',desc:'Plan schedules, assignments and production.',short:'Schedule & production',action:'Open Timeline'},
{name:'Project Office',icon:'clipboard-list',desc:'Manage inquiries, job setup and closeout.',short:'Pipeline, setup & closeout',action:'Open Project Office'},
{name:'Clients',icon:'building-2',desc:'Find contacts and the full project history.',short:'Contacts & project history',action:'Open Clients'},
{name:'People',icon:'users',desc:'Find colleagues, roles and availability.',short:'Directory & availability',action:'Open People'},
{name:'Tools',icon:'wrench',desc:'Access software, plugins and shared scripts.',short:'Software, scripts & access',action:'Open Tools'},
{name:'Accounting',icon:'receipt-text',desc:'Review costs, billing and financial closeout.',short:'Costs, billing & exports',action:'Request access',locked:true}
];
const icon=n=>`<span class="icon"><i data-lucide="${n}" aria-hidden="true"></i></span>`;
const appRow=a=>`<button class="app-row" data-open="${a.name}">${icon(a.icon)}<span class="names">${a.name}<small>${a.short}</small></span><span aria-hidden="true">${a.locked?'↗':'→'}</span></button>`;
const recent=()=>`<div class="section-head"><h2>Recently opened</h2><span class="micro">For you</span></div><div class="recent"><button class="record" data-open="Timeline" data-record="Autumn window installation"><span>Autumn window installation<small>Timeline · Project schedule</small></span><span class="micro">EX-026</span></button><button class="record" data-open="Tools" data-record="Rhino fabrication scripts"><span>Rhino fabrication scripts<small>Tools · Approved resources</small></span><span aria-hidden="true">→</span></button></div>`;
root.querySelectorAll('.ts-product').forEach(shell=>{
const v=shell.dataset.design;
shell.innerHTML=`<header class="top"><button class="brand" data-home>TWOSEVEN INC.</button><span class="top-name">Home</span><span class="top-spacer"></span><button class="top-btn" data-switch aria-expanded="false"><i data-lucide="grid-2x2" aria-hidden="true"></i>Apps</button><span class="avatar" aria-label="Signed in as Sam Jones">SJ</span><nav class="switcher" aria-label="Switch app" hidden>${apps.map(appRow).join('')}</nav></header><div class="trail"><span>Company workspace</span><span>Wireframe · example content</span></div><main class="main"></main><footer class="footer"><span>Signed in with your company account</span><button class="plain" data-help>Get help or request access</button></footer><section class="overlay" aria-label="App destination preview" hidden><button class="plain" data-back>← Back to Home</button><div class="destination" aria-live="polite"></div></section>`;
const main=shell.querySelector('.main');
if(v==='launcher')main.innerHTML=`<div class="intro"><div><h1>Your workspace</h1><p>Open an app to get started, or return to recent work.</p></div><span class="micro">Sam Jones</span></div><div class="app-grid">${apps.map(a=>`<button class="app-link" data-open="${a.name}"><span class="app-head">${icon(a.icon)}${a.name}<span class="go" aria-hidden="true">→</span></span><span class="app-description">${a.desc}</span><span class="app-foot">${a.action}${a.locked?' · restricted workspace':''}</span></button>`).join('')}</div>${recent()}`;
const overlay=shell.querySelector('.overlay'),destination=shell.querySelector('.destination'),switcher=shell.querySelector('.switcher'),switchButton=shell.querySelector('[data-switch]');
function close(){overlay.hidden=true;shell.querySelector('.top-name').textContent='Home';}
shell.addEventListener('click',e=>{
const b=e.target.closest('button');if(!b)return;
if(b.hasAttribute('data-switch')){switcher.hidden=!switcher.hidden;switchButton.setAttribute('aria-expanded',String(!switcher.hidden));return;}
if(b.hasAttribute('data-home')||b.hasAttribute('data-back')){close();return;}
if(b.hasAttribute('data-open')||b.hasAttribute('data-help')){
const a=apps.find(a=>a.name===b.dataset.open);switcher.hidden=true;switchButton.setAttribute('aria-expanded','false');overlay.hidden=false;
shell.querySelector('.top-name').textContent=a?a.name:'Help';
destination.innerHTML=a&&!a.locked?`<span class="micro">${a.name} / ${b.dataset.record?'Record':'Home'}</span><h2>${b.dataset.record||a.name}</h2><p>${a.desc}</p><div class="placeholder">Destination preview — the selected app opens here with the shared company header and app switcher.</div>`:`<span class="micro">ACCESS & SUPPORT</span><h2>${a?'Accounting access':'Get help'}</h2><p>${a?'This workspace requires permission.':'Contact the workspace administrator for support or app access.'}</p><div class="placeholder">Wireframe only — no request has been sent.</div>`;
shell.querySelector('[data-back]').focus();
}
});
shell.addEventListener('keydown',e=>{if(e.key==='Escape'){switcher.hidden=true;switchButton.setAttribute('aria-expanded','false');close();}});
const input=shell.querySelector('input');if(input)input.addEventListener('input',()=>{let count=0;shell.querySelectorAll('[data-query]').forEach(row=>{row.hidden=!row.dataset.query.includes(input.value.toLowerCase().trim());if(!row.hidden)count++;});shell.querySelector('[data-count]').textContent=count+' app'+(count===1?'':'s');shell.querySelector('[data-empty]').hidden=count!==0;});
});
if(globalThis.lucide)lucide.createIcons();
})();
</script>
</div>
