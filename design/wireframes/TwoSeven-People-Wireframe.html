<script>
(()=>{
const root=document.getElementById('people-clients-apps');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const people=[
{id:1,name:'Alex Rivera',role:'Lead Technical Designer',dept:'Technical Design',kind:'Employee',status:'Available',manager:'Design lead',schedule:'Mon–Fri · 9:00–18:00',skills:['Rhino','Grasshopper','Fabrication drawings'],assign:['EX-026','EX-031']},
{id:2,name:'Jamie Park',role:'Project Manager',dept:'Project Management',kind:'Employee',status:'Available',manager:'Project director',schedule:'Mon–Fri · 9:00–18:00',skills:['Client coordination','Installation'],assign:['EX-026','EX-031']},
{id:3,name:'Morgan Reed',role:'Lead Fabricator',dept:'Main Shop',kind:'Employee',status:'Away',manager:'Production director',schedule:'Mon–Fri · 8:00–17:00',skills:['Wood fabrication','Shop supervision'],assign:['EX-026']},
{id:4,name:'Taylor Brooks',role:'Technical Designer',dept:'Technical Design',kind:'Freelancer',status:'Available',manager:'Design lead',schedule:'By assignment',skills:['Rhino','3D printing'],assign:['EX-031']},
{id:5,name:'Casey Kim',role:'Finisher',dept:'Finishing',kind:'Employee',status:'Available',manager:'Finishing lead',schedule:'Mon–Fri · 8:00–17:00',skills:['Paint','Surface preparation'],assign:['EX-026']},
{id:6,name:'Jordan Lee',role:'Fabricator',dept:'Main Shop',kind:'Freelancer',status:'Unavailable',manager:'Production director',schedule:'By assignment',skills:['Assembly','Metal fabrication'],assign:[]}
];
const jobs=[{id:'EX-026',name:'Autumn window installation',client:1,stage:'In production',date:'Oct 26, 2026',pm:'Jamie Park',team:'Alex Rivera · Morgan Reed · Casey Kim',estimate:48000,approved:52500},{id:'EX-031',name:'Flagship display fixtures',client:1,stage:'In design',date:'Nov 12, 2026',pm:'Jamie Park',team:'Alex Rivera · Taylor Brooks',estimate:32000,approved:34000},{id:'EX-019',name:'Summer showroom',client:1,stage:'Closed',date:'Jul 17, 2026',pm:'Jamie Park',team:'Morgan Reed',estimate:26000,approved:26500},{id:'EX-041',name:'Interactive gallery',client:2,stage:'Estimating',date:'Dec 4, 2026',pm:'Jamie Park',team:'Unassigned',estimate:18000,approved:0}];
const clients=[{id:1,name:'Alder Studio',alias:'ALD',owner:'Jamie Park',sector:'Retail & display',status:'Active',notes:'Confirm installation access with the client before committing the final delivery window.',contacts:[{name:'Sam Ellis',role:'Visual merchandising lead',email:'sam@alder.example',primary:true},{name:'Robin Chen',role:'Project coordinator',email:'robin@alder.example',primary:false}]},{id:2,name:'Fieldwork Museum',alias:'FWM',owner:'Jamie Park',sector:'Museum & exhibition',status:'Active',notes:'Coordinate fabrication milestones with the exhibition team.',contacts:[{name:'Charlie Lane',role:'Exhibitions producer',email:'charlie@fieldwork.example',primary:true}]},{id:3,name:'Northline Retail',alias:'NLR',owner:'Unassigned',sector:'Retail & display',status:'Prospect',notes:'Introductory inquiry received.',contacts:[]},{id:4,name:'Common Ground',alias:'CG',owner:'Jamie Park',sector:'Brand experience',status:'Inactive',notes:'Past relationship; no current work.',contacts:[]}];
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const button=(txt,act,primary=false)=>`<button type="button" class="action${primary?' primary':''}" data-act="${act}">${txt}</button>`;
const tag=s=>`<span class="status ${['Away','Unavailable','Prospect','Inactive'].includes(s)?'away':''}">${esc(s)}</span>`;
const personNotes={},activity=[];
root.querySelectorAll('.pc-app').forEach(app=>{
const type=app.dataset.app;
const state={page:type==='people'?'Directory':'Clients',person:1,client:1,tab:'Overview',query:'',filter:'All',notify:true};
const nav=type==='people'?[['Directory','users'],['Availability','calendar-days'],['Organization','network'],['Administration','clipboard-check'],['Settings','settings']]:[['Clients','building-2'],['Contacts','contact'],['Reports','chart-no-axes-combined'],['Settings','settings']];
app.innerHTML=`<header class="top"><span class="brand">TWOSEVEN INC.</span><span class="app-name">${type==='people'?'People':'Clients'}</span><span class="grow"></span><span class="badge">${type==='people'?'Office manager':'Project manager'}</span><button class="quiet" data-act="apps">Apps ▾</button><span class="avatar">SJ</span></header><div class="toast" role="status" hidden></div><div class="layout"><nav class="sidebar" aria-label="${type} navigation">${nav.map(([name,i])=>`<button class="nav-item" data-page="${name}">${icon(i)}${name}</button>`).join('')}<div class="bottom">TwoSeven workspace<br>Help & support</div></nav><main class="main"></main></div><footer class="footer"><span>Interactive concept · fictional records</span><span>Changes stay in this preview</span></footer><div class="modal-shade" hidden><section class="modal" role="dialog" aria-modal="true" aria-label="Preview dialog"></section></div>`;
const main=app.querySelector('main');
const p=()=>people.find(x=>x.id===state.person),c=()=>clients.find(x=>x.id===state.client);
function title(name,desc,action=''){return `<div class="page-title"><div><h1>${name}</h1><p class="dim">${desc}</p></div>${action}</div>`;}
function flash(msg){const t=app.querySelector('.toast');t.hidden=false;t.textContent=msg;}
function render(){app.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===state.page));if(type==='people')renderPeople();else renderClients();if(globalThis.lucide)lucide.createIcons();}
function contactsHtml(cs){return cs.length?cs.map(x=>`<div class="small-row"><div><p><strong>${esc(x.name)}</strong> ${x.primary?'<span class="chip">Primary</span>':''}</p><p class="dim">${esc(x.role)}</p><span class="dim">${esc(x.email)}</span></div>${button('Edit','contact-edit:'+encodeURIComponent(x.email))}</div>`).join(''):'<p class="dim">No contacts yet.</p>';}
function jobsHtml(list,financial=false){return list.length?list.map(j=>`<div class="small-row"><div><button class="text-action" data-act="job:${j.id}">${j.name}</button><p class="micro">${j.id} · ${j.date}</p><p class="dim">${financial?'Approved: $'+j.approved.toLocaleString()+' · Estimate: $'+j.estimate.toLocaleString():j.stage+' · PM: '+j.pm}</p></div><button class="quiet" data-act="job:${j.id}" aria-label="Open ${j.name}">→</button></div>`).join(''):'<p class="dim">No projects to display.</p>';}
function personRecord(){const x=p();return `<section class="record"><div class="record-top"><div class="record-avatar">${x.name.split(' ').map(n=>n[0]).join('')}</div><div><h2>${esc(x.name)}</h2><p class="dim">${esc(x.role)} · ${esc(x.dept)}</p></div><span class="grow"></span>${tag(x.status)}${button('Edit profile','edit-person')}</div><div class="tabs" role="tablist" aria-label="Person record">${['Overview','Assignments','Administration','Activity'].map(t=>`<button role="tab" aria-selected="${state.tab===t}" class="${state.tab===t?'active':''}" data-tab="${t}">${t}</button>`).join('')}</div><div class="record-body" data-record-body></div></section>`;}
function personBody(){const x=p();const record=main.querySelector('[data-record-body]');if(!record)return;
if(state.tab==='Overview')record.innerHTML=`<div class="two"><section><h3>Work profile</h3><dl class="properties"><dt>Work email</dt><dd>${x.name.toLowerCase().replace(' ','.')}@twoseven.example</dd><dt>Reports to</dt><dd>${esc(x.manager)}</dd><dt>Engagement</dt><dd>${x.kind}</dd><dt>Schedule</dt><dd>${esc(x.schedule)}</dd></dl><div class="chips">${x.skills.map(s=>`<span class="chip">${s}</span>`).join('')}</div></section><section><div class="section-line"><h3>Availability</h3>${button('Update','availability-edit')}</div><p>${x.status==='Away'?'Away this week':x.status==='Unavailable'?'Not accepting assignments':'Available for scheduling'}</p><p class="dim">Operational availability is shared with Timeline.</p><div class="section-line"><h3>Profile note</h3><button class="text-action" data-act="person-note">Add note</button></div><p class="note">${esc(personNotes[x.id]||'No additional profile notes.')}</p></section></div>`;
if(state.tab==='Assignments')record.innerHTML=`<div class="section-line"><h3>Project assignments</h3><span class="micro">From Timeline</span></div>${jobsHtml(jobs.filter(j=>x.assign.includes(j.id)))}<p class="dim" style="margin-top:15px">Assignment changes are made in Timeline.</p>`;
if(state.tab==='Administration')record.innerHTML=`<div class="section-line"><h3>Employment administration</h3><span class="chip">Restricted · office manager</span></div><div class="two"><section><dl class="properties"><dt>Employment</dt><dd>${x.kind}</dd><dt>Payroll source</dt><dd>ADP</dd><dt>Company ID</dt><dd class="micro">P-${String(x.id).padStart(3,'0')}</dd><dt>Onboarding</dt><dd>Completed</dd></dl></section><section><h3>Internal responsibilities</h3><p>✓ Software access confirmed</p><p>✓ Safety orientation recorded</p><p>✓ Department assignment reviewed</p>${button('Review offboarding','offboarding')}</section></div><div class="callout" style="margin-top:18px">Pay, tax and benefits records remain in ADP. This area manages internal processes and references.</div>`;
if(state.tab==='Activity')record.innerHTML=activity.filter(a=>a.person===x.id).map(a=>`<div class="small-row"><div>${esc(a.text)}<p class="micro">Just now · preview</p></div></div>`).join('')||'<p class="dim">No changes made to this profile in this preview.</p>';
}
function renderPeople(){
if(state.page==='Directory'){main.innerHTML=title('People','Find colleagues, understand roles and plan availability.',button('+ Add person','add-person',true))+`<div class="controls"><input class="input" data-search placeholder="Search name, role or skill…" aria-label="Search people" value="${esc(state.query)}"><select class="input" data-filter aria-label="Department filter"><option>All departments</option>${[...new Set(people.map(p=>p.dept))].map(d=>`<option ${state.filter===d?'selected':''}>${d}</option>`).join('')}</select><span class="micro" style="align-self:center" data-count></span></div><div class="panel"><table class="list"><thead><tr><th>Name / role</th><th class="optional">Department</th><th>Availability</th><th class="optional">Engagement</th></tr></thead><tbody>${people.map(x=>`<tr data-person-row="${x.id}" class="${x.id===state.person?'selected':''}"><td><button class="name-button" data-person="${x.id}">${esc(x.name)}</button><div class="dim">${esc(x.role)}</div></td><td class="optional">${esc(x.dept)}</td><td>${tag(x.status)}</td><td class="optional dim">${x.kind}</td></tr>`).join('')}</tbody></table></div>${personRecord()}`;filterPeople();personBody();}
if(state.page==='Availability'){main.innerHTML=title('Availability','Operational schedule · week of September 28',button('Update availability','availability-edit'))+`<div class="panel availability"><div>Person</div>${['Mon 28','Tue 29','Wed 30','Thu 1','Fri 2'].map(s=>`<div class="micro">${s}</div>`).join('')}${people.map(x=>`<div><button class="name-button" data-person="${x.id}">${x.name}</button></div>${Array.from({length:5},()=>`<div>${x.status==='Available'?(x.schedule==='By assignment'?'By job':x.schedule.includes('8:00')?'8–5':'9–6'):x.status==='Away'?'Away':'—'}</div>`).join('')}`).join('')}</div><div class="callout" style="margin-top:20px">Availability describes when someone can work. Project assignments and workload remain in Timeline.</div>`;}
if(state.page==='Organization')main.innerHTML=title('Organization','Department membership and reporting relationships.')+`<div class="panel org"><h2>TwoSeven</h2><p class="dim">Illustrative reporting structure</p>${[...new Set(people.map(p=>p.dept))].map(d=>`<section class="org-group"><h3>${d}</h3>${people.filter(p=>p.dept===d).map(x=>`<div class="small-row"><button class="name-button" data-person="${x.id}">${x.name}</button><span class="dim">${x.role}</span></div>`).join('')}</section>`).join('')}</div>`;
if(state.page==='Administration')main.innerHTML=title('Administration','Internal onboarding, access and offboarding tasks.')+`<div class="panel"><div class="settings-row"><div><h3>Confirm freelancer availability</h3><p class="dim">Taylor Brooks · before the next assignment</p></div>${button('Review','review-taylor')}</div><div class="settings-row"><div><h3>Reconcile directory with ADP</h3><p class="dim">Review proposed contact and employment-status updates.</p></div>${button('Review changes','adp')}</div><div class="settings-row"><div><h3>Offboarding checklist</h3><p class="dim">Access, equipment and future scheduling eligibility.</p></div>${button('Start review','offboarding')}</div></div>`;
if(state.page==='Settings')settings();
}
function clientRecord(){const x=c();return `<section class="record"><div class="record-top"><div><h2>${esc(x.name)}</h2><p class="micro">${x.alias} · ${x.sector}</p></div><span class="grow"></span>${tag(x.status)}</div><div class="tabs" role="tablist" aria-label="Client record">${['Overview','Contacts','Projects','Financials','Activity'].map(t=>`<button role="tab" aria-selected="${state.tab===t}" class="${state.tab===t?'active':''}" data-tab="${t}">${t}</button>`).join('')}</div><div class="record-body" data-record-body></div></section>`;}
function clientBody(){const x=c(),list=jobs.filter(j=>j.client===x.id),record=main.querySelector('[data-record-body]');if(!record)return;
if(state.tab==='Overview')record.innerHTML=`<div class="section-line"><h3>Relationship</h3><button class="text-action" data-act="edit-client">Edit client</button></div><dl class="properties"><dt>Account owner</dt><dd>${x.owner}</dd><dt>Client alias</dt><dd class="micro">${x.alias}</dd><dt>Primary contact</dt><dd>${esc(x.contacts.find(y=>y.primary)?.name||'Not assigned')}</dd></dl><div class="section-line" style="margin-top:24px"><h3>Current projects</h3><button class="text-action" data-settab="Projects">View history</button></div>${jobsHtml(list.filter(j=>j.stage!=='Closed'))}<div class="section-line" style="margin-top:20px"><h3>Relationship note</h3><button class="text-action" data-act="client-note">Edit note</button></div><p class="note">${esc(x.notes)}</p>`;
if(state.tab==='Contacts')record.innerHTML=`<div class="section-line"><h3>Client contacts</h3>${button('+ Add','add-contact')}</div>${contactsHtml(x.contacts)}`;
if(state.tab==='Projects')record.innerHTML=`<div class="section-line"><h3>Project history</h3><span class="micro">${list.length} projects</span></div>${jobsHtml(list)}<div class="callout" style="margin-top:16px">Project dates, cost codes and teams come from the shared project record.</div>`;
if(state.tab==='Financials')record.innerHTML=`<div class="section-line"><h3>Commercial summary</h3><span class="chip">Assigned-project access</span></div>${jobsHtml(list,true)}<div class="callout" style="margin-top:18px"><h3>Revenue, actual costs & margin</h3><p class="dim">Restricted to accounting and authorized leadership.</p>${button('Request access','request-access')}</div><p class="dim" style="margin-top:15px">Estimates and approved values are distinct from invoiced revenue. Financial records are maintained in the responsible application.</p>`;
if(state.tab==='Activity')record.innerHTML=activity.filter(a=>a.client===x.id).map(a=>`<div class="small-row"><div>${esc(a.text)}<p class="micro">Just now · preview</p></div></div>`).join('')||'<p class="dim">No changes made to this client in this preview.</p>';
}
function renderClients(){
if(state.page==='Clients'){main.innerHTML=title('Clients','Relationships, contacts and a complete project history.',button('+ Add client','add-client',true))+`<div class="controls"><input class="input" data-search placeholder="Search clients or aliases…" aria-label="Search clients" value="${esc(state.query)}"><select class="input" data-filter aria-label="Client status"><option>All statuses</option>${['Active','Prospect','Inactive'].map(s=>`<option ${state.filter===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="client-layout"><div class="panel client-index">${clients.map(x=>`<button class="client-item ${state.client===x.id?'active':''}" data-client="${x.id}"><strong>${esc(x.name)}</strong><span class="micro">${esc(x.alias)} · ${x.status}</span><div class="dim" style="margin-top:6px">${jobs.filter(j=>j.client===x.id&&j.stage!=='Closed').length} current projects</div></button>`).join('')}<p class="dim" data-empty hidden style="padding:14px">No matching clients.</p></div>${clientRecord()}</div>`;filterClients();clientBody();}
if(state.page==='Contacts')main.innerHTML=title('Contacts','Find the right person across client accounts.')+`<div class="panel"><table class="list"><thead><tr><th>Contact</th><th>Client</th><th class="optional">Role / email</th></tr></thead><tbody>${clients.flatMap(x=>x.contacts.map(ct=>`<tr><td><button class="name-button" data-contact-client="${x.id}">${esc(ct.name)}</button>${ct.primary?'<div class="dim">Primary contact</div>':''}</td><td>${esc(x.name)}</td><td class="optional">${esc(ct.role)}<div class="dim">${esc(ct.email)}</div></td></tr>`)).join('')}</tbody></table></div>`;
if(state.page==='Reports')main.innerHTML=title('Client activity','Account coverage and current work.')+`<div class="panel"><table class="list"><thead><tr><th>Client</th><th>Current projects</th><th>Owner</th><th class="optional">Primary contact</th></tr></thead><tbody>${clients.map(x=>`<tr><td><button class="name-button" data-client="${x.id}">${esc(x.name)}</button></td><td>${jobs.filter(j=>j.client===x.id&&j.stage!=='Closed').length}</td><td>${esc(x.owner)}</td><td class="optional">${esc(x.contacts.find(y=>y.primary)?.name||'Not assigned')}</td></tr>`).join('')}</tbody></table></div><p class="dim" style="margin-top:16px">Financial reporting is available in Accounting, subject to your permissions.</p>`;
if(state.page==='Settings')settings();
}
function settings(){main.innerHTML=title('Settings','Your preferences and application responsibilities.')+`<div class="panel"><div class="settings-row"><div><strong>Table density</strong><p class="dim">Adjust row spacing for this application.</p></div><select class="input" data-density aria-label="Table density"><option ${app.classList.contains('compact')?'':'selected'}>Comfortable</option><option ${app.classList.contains('compact')?'selected':''}>Compact</option></select></div><label class="settings-row"><div><strong>Assigned-action notifications</strong><p class="dim">Notify me when an action is assigned to me.</p></div><input data-notify type="checkbox" ${state.notify?'checked':''}></label><div class="settings-row"><div><strong>${type==='people'?'Directory ownership':'Client-record ownership'}</strong><p class="dim">${type==='people'?'Office manager · employment source: ADP':'Account owners maintain contacts and relationship notes.'}</p></div><span class="chip">Managed</span></div><div class="settings-row"><div><strong>Access & permissions</strong><p class="dim">${type==='people'?'HR administration is restricted. Directory visibility is separate.':'Commercial and accounting data have separate access controls.'}</p></div>${button('View access','access')}</div></div>`;}
function filterPeople(){let n=0;main.querySelectorAll('[data-person-row]').forEach(row=>{const x=people.find(x=>x.id===Number(row.dataset.personRow));row.hidden=!(x.name+' '+x.role+' '+x.skills.join(' ')).toLowerCase().includes(state.query.toLowerCase())||(!['All','All departments'].includes(state.filter)&&x.dept!==state.filter);if(!row.hidden)n++;});const count=main.querySelector('[data-count]');if(count)count.textContent=n+' people';}
function filterClients(){let n=0;main.querySelectorAll('[data-client]').forEach(row=>{const x=clients.find(x=>x.id===Number(row.dataset.client));row.hidden=!(x.name+' '+x.alias).toLowerCase().includes(state.query.toLowerCase())||(!['All','All statuses'].includes(state.filter)&&x.status!==state.filter);if(!row.hidden)n++;});const empty=main.querySelector('[data-empty]');if(empty)empty.hidden=n>0;}
let modalMode='',contactEmail='',lastFocus=null;
function modal(title,content,mode='',submit='Save'){modalMode=mode;lastFocus=document.activeElement;const shade=app.querySelector('.modal-shade');shade.hidden=false;shade.querySelector('.modal').innerHTML=`<div class="section-line"><h2>${title}</h2><button type="button" class="quiet" data-act="close" aria-label="Close dialog">×</button></div><form><div>${content}</div><div class="modal-actions">${button(mode?'Cancel':'Close','close')}${mode?`<button class="action primary" type="submit">${submit}</button>`:''}</div></form>`;shade.querySelector('input,textarea,select,button').focus();}
function input(label,name,value='',kind='text'){return `<label>${label}<input class="input" name="${name}" value="${esc(value)}" type="${kind}" required></label>`;}
function close(){app.querySelector('.modal-shade').hidden=true;if(lastFocus?.isConnected)lastFocus.focus();}
function act(a){
if(a==='close'){close();return;}
if(a==='apps'){modal('TwoSeven apps',`<p class="dim">Switch applications while retaining your company account.</p><div class="small-row">People ${button('Open','switch-people')}</div><div class="small-row">Clients ${button('Open','switch-clients')}</div><div class="small-row">Timeline <span class="dim">Separate application</span></div><div class="small-row">Project Office <span class="dim">Separate application</span></div><div class="small-row">Tools <span class="dim">Separate application</span></div><div class="small-row">Accounting <span class="dim">Restricted</span></div>`);return;}
if(a.startsWith('switch-')){const target=a==='switch-people'?'People':'Clients';if(target.toLowerCase()===type){close();return;}modal(target+' wireframe', '<p>This standalone document contains the '+(type==='people'?'People':'Clients')+' application.</p><p class="dim">Open the separately supplied TwoSeven-'+target+'-Wireframe.html file to review '+target+'. No live application is connected.</p>');return;}
if(a==='add-person'||a==='edit-person'){const x=p();modal(a==='add-person'?'Add a person':'Edit work profile',input('Name','name',a==='edit-person'?x.name:'')+input('Role','role',a==='edit-person'?x.role:'')+input('Department','dept',a==='edit-person'?x.dept:'')+'<p class="dim" style="margin-top:12px">Work-directory information only. Payroll records remain in ADP.</p>',a);return;}
if(a==='availability-edit'){modal('Update availability',`<p>${esc(p().name)}</p><label>Availability<select class="input" name="status">${['Available','Away','Unavailable'].map(s=>`<option ${p().status===s?'selected':''}>${s}</option>`).join('')}</select></label><p class="dim" style="margin-top:15px">Changes in this concept stay in the preview.</p>`,a);return;}
if(a==='person-note'||a==='client-note'){const note=a==='person-note'?personNotes[p().id]||'':c().notes;modal('Record note',`<label>Note<textarea class="input" name="note" required>${esc(note)}</textarea></label>`,a);return;}
if(a==='add-client'||a==='edit-client'){const x=c();modal(a==='add-client'?'Add client':'Edit client',input('Client name','name',a==='edit-client'?x.name:'')+input('Alias','alias',a==='edit-client'?x.alias:'')+input('Account owner','owner',a==='edit-client'?x.owner:'')+`<label>Status<select class="input" name="status">${['Active','Prospect','Inactive'].map(s=>`<option ${a==='edit-client'&&x.status===s?'selected':''}>${s}</option>`).join('')}</select></label>`,a);return;}
if(a==='add-contact'||a.startsWith('contact-edit:')){contactEmail=a.startsWith('contact-edit:')?decodeURIComponent(a.split(':')[1]):'';const ct=c().contacts.find(x=>x.email===contactEmail);modal(ct?'Edit contact':'Add contact',input('Name','name',ct?.name||'')+input('Role','role',ct?.role||'')+input('Work email','email',ct?.email||'','email')+`<label><input type="checkbox" name="primary" ${ct?.primary?'checked':''}> Primary contact</label>`,'contact');return;}
if(a.startsWith('job:')){const j=jobs.find(j=>j.id===a.split(':')[1]);modal(j.name,`<p class="micro">${j.id} · ${j.stage}</p><dl class="properties"><dt>Delivery</dt><dd>${j.date}</dd><dt>PM</dt><dd>${j.pm}</dd><dt>Team</dt><dd>${j.team}</dd></dl><div class="callout" style="margin-top:20px">In the finished application, this link opens the same project in Timeline. This preview does not navigate to live records.</div>`);return;}
if(a==='review-taylor'){state.person=4;state.page='Directory';state.tab='Administration';render();return;}
if(a==='request-access'){modal('Request financial access',`<p class="dim">Revenue, costs and margin require a separate grant.</p><label>Business reason<textarea class="input" name="reason" required></textarea></label>`,'request-access','Preview request');return;}
if(a==='access'){modal('Your application access',`<p><strong>${type==='people'?'Office manager':'Project manager'}</strong></p><p>${type==='people'?'Directory: read and edit<br>Availability: read and edit<br>Internal HR administration: authorized<br>Payroll and benefits: managed in ADP':'Clients and contacts: read and edit<br>Project history: read<br>Assigned-project estimates: read<br>Revenue, costs and margin: restricted'}</p><div class="callout">Illustrative permissions. Production access must be enforced by the data service.</div>`);return;}
if(a==='adp'){modal('Review ADP reconciliation','<p>No import runs in this preview.</p><p class="dim">The proposed workflow compares approved source fields, shows additions and changes, and asks the office manager to resolve conflicts before applying updates.</p>');return;}
if(a==='offboarding'){modal('Offboarding review',`<p class="dim">Review only. No account or employment changes are made.</p><label><input type="checkbox"> Confirm effective date with HR</label><label><input type="checkbox"> Reassign upcoming work</label><label><input type="checkbox"> Coordinate access removal with SysAdmin</label><label><input type="checkbox"> Confirm equipment return</label>`);return;}
}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){state.page=b.dataset.page;state.query='';state.filter='All';state.tab='Overview';render();}else if(b.dataset.person){state.person=Number(b.dataset.person);state.page='Directory';state.tab='Overview';render();}else if(b.dataset.client){state.client=Number(b.dataset.client);state.page='Clients';state.tab='Overview';render();}else if(b.dataset.contactClient){state.client=Number(b.dataset.contactClient);state.page='Clients';state.tab='Contacts';render();}else if(b.dataset.tab||b.dataset.settab){state.tab=b.dataset.tab||b.dataset.settab;render();}else if(b.dataset.act)act(b.dataset.act);});
app.addEventListener('input',e=>{if(e.target.hasAttribute('data-search')){state.query=e.target.value;type==='people'?filterPeople():filterClients();}});
app.addEventListener('change',e=>{if(e.target.hasAttribute('data-filter')){state.filter=e.target.value;type==='people'?filterPeople():filterClients();}if(e.target.hasAttribute('data-density')){app.classList.toggle('compact',e.target.value==='Compact');flash('Table spacing updated in this preview.');}if(e.target.hasAttribute('data-notify')){state.notify=e.target.checked;flash('Notification preference updated in this preview.');}});
app.addEventListener('submit',e=>{e.preventDefault();const data=new FormData(e.target);const mode=modalMode;
if(mode==='edit-person'){Object.assign(p(),{name:data.get('name'),role:data.get('role'),dept:data.get('dept')});activity.unshift({person:p().id,text:'Work profile updated'});}
if(mode==='add-person'){const id=Math.max(...people.map(x=>x.id))+1;people.push({id,name:data.get('name'),role:data.get('role'),dept:data.get('dept'),kind:'Employee',status:'Available',manager:'Unassigned',schedule:'Not set',skills:[],assign:[]});state.person=id;state.page='Directory';state.tab='Overview';}
if(mode==='availability-edit'){p().status=data.get('status');activity.unshift({person:p().id,text:'Availability updated to '+p().status});}
if(mode==='person-note'){personNotes[p().id]=data.get('note');activity.unshift({person:p().id,text:'Profile note updated'});}
if(mode==='client-note'){c().notes=data.get('note');activity.unshift({client:c().id,text:'Relationship note updated'});}
if(mode==='edit-client')Object.assign(c(),{name:data.get('name'),alias:data.get('alias'),owner:data.get('owner'),status:data.get('status')});
if(mode==='add-client'){const id=Math.max(...clients.map(x=>x.id))+1;clients.push({id,name:data.get('name'),alias:data.get('alias'),owner:data.get('owner'),status:data.get('status'),sector:'Not classified',notes:'No relationship notes.',contacts:[]});state.client=id;state.page='Clients';state.tab='Overview';}
if(mode==='contact'){const ct={name:data.get('name'),role:data.get('role'),email:data.get('email'),primary:data.has('primary')};if(ct.primary)c().contacts.forEach(x=>x.primary=false);const old=c().contacts.findIndex(x=>x.email===contactEmail);if(old>=0)c().contacts[old]=ct;else c().contacts.push(ct);activity.unshift({client:c().id,text:'Client contact '+(old>=0?'updated':'added')});}
close();render();flash(mode==='request-access'?'Request previewed. Nothing was sent.':'Saved in this preview only.');});
app.addEventListener('keydown',e=>{const shade=app.querySelector('.modal-shade');if(shade.hidden)return;if(e.key==='Escape'){close();return;}if(e.key==='Tab'){const nodes=[...shade.querySelectorAll('button,input,select,textarea')];const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
render();
});
})();
</script>
</div>

<noscript><p style="padding:16px;font:14px Arial">Enable JavaScript to display this interactive wireframe and review its tabs, menus and example edits. No live data is connected.</p></noscript>
</body>
