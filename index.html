<!-- The Systems page (item 49, D4): one card per product, laid out as the owner's Portal
     Option 1 wireframe. Timeline lives in timeline/, Office in office/ (item 86 built it as
     Clients, v1.58.0; item 94 renamed it Office, v1.61.0), People in people/ (item 87, v1.62.0).
     The wireframe's Apps menu, avatar, recent
     work and signed-in footer wait for a page that signs in. -->
<script>
/* Old links and bookmarks: a #/… route or a #view= link belonged to Timeline when it lived
   here. Send it on to timeline/ with the route intact. A sign-in reply (#code=…) stays put. */
if(/^#\/people(\/|$)/.test(location.hash))location.replace('people/'); /* item 87: People is its own app */
else if(/^#(\/|view=)/.test(location.hash))location.replace('timeline/'+location.hash);
</script>
<!-- A Timeline tab opened before the move still checks this page for a newer build, so this
     page names the move's release for it: APP_VER='1.56.0' (fixed; only pre-move tabs read it). -->
<!-- The suite tokens and the shell's header come from the shared stylesheet (item 52 step 4). -->
<link rel="stylesheet" href="common/common.css?v=1.62.7">
<style>
/* The look of the owner's Portal Option 1 wireframe (design/wireframes/), in the target
   guide's tokens and normalised values (design/TwoSeven-Application-Style-Guide.md §2–§5, §10). */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:var(--sans);font-size:13px;line-height:1.45;color:var(--ts-text);background:var(--ts-paper)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
:focus-visible{outline:2px solid var(--ts-action);outline-offset:3px}
main{max-width:1100px;margin:0 auto;padding:28px 32px 32px}
h1{font-size:22px;line-height:1.25;font-weight:600;margin-bottom:6px}
.intro{margin-bottom:24px}
.intro p{color:var(--ts-muted)}
/* App cards (guide §5: 20px padding, 150px minimum, 8px radius; no resting shadow). */
.app-grid{list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.app-link{display:flex;flex-direction:column;gap:9px;height:100%;min-height:150px;padding:20px;background:var(--ts-panel);border:1px solid var(--ts-line);border-radius:8px;color:var(--ts-text);text-decoration:none;transition:border-color .12s,background .12s}
a.app-link:hover{border-color:var(--ts-action);background:var(--ts-selected)}
.app-head{display:flex;align-items:center;gap:10px;font-size:15px;line-height:1.35;font-weight:600}
.go{margin-left:auto;color:var(--ts-muted);font-weight:400}
.icon{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;width:30px;height:30px;border-radius:6px;background:var(--ts-sidebar);color:var(--ts-text)}
.icon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.app-description{min-height:35px;font-size:12px;color:var(--ts-muted)}
.app-foot{margin-top:auto;font-size:11px;color:var(--ts-link)}
/* Not built yet: no link, no arrow, no panel fill, a dashed edge, muted text. */
.app-link.off{background:transparent;border-style:dashed}
.app-link.off .app-head,.app-link.off .icon,.app-link.off .app-foot{color:var(--ts-muted)}
@media (max-width:760px){main{padding:24px 20px}.app-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:500px){.app-grid{grid-template-columns:1fr}.app-link{min-height:125px}.app-description{min-height:0}}
</style>
</head>
<body>
<header class="ts-top">
  <span class="ts-brand">TWOSEVEN INC.</span>
  <span class="ts-app">Systems</span>
</header>
<main>
  <div class="intro">
    <h1>Your workspace</h1>
    <p>Open an app to get started.</p>
  </div>
  <!-- Icons: the wireframe's line icons (Lucide shapes), inline. -->
  <ul class="app-grid">
    <li><a class="app-link" href="timeline/"><span class="app-head"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18M8 16h8"/></svg></span><span class="app-name">Timeline</span><span class="go" aria-hidden="true">→</span></span><span class="app-description">Project schedules, phases and teams</span><span class="app-foot">Open Timeline</span></a></li>
    <li><a class="app-link" href="office/"><span class="app-head"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="5" y="4" width="14" height="18" rx="2"/><rect x="9" y="2" width="6" height="4" rx="1"/><path d="M9 12h.01M12 12h3M9 16h.01M12 16h3"/></svg></span><span class="app-name">Office</span><span class="go" aria-hidden="true">→</span></span><span class="app-description">Clients and their projects</span><span class="app-foot">Open Office · admins only</span></a></li>
    <li><a class="app-link" href="people/"><span class="app-head"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2m20 0v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/><circle cx="9" cy="7" r="4"/></svg></span><span class="app-name">People</span><span class="go" aria-hidden="true">→</span></span><span class="app-description">Staff, contact details and time off</span><span class="app-foot">Open People</span></a></li>
  </ul>
</main>
</body>
