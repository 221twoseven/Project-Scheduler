<!-- Office (item 94, v1.61.0: Clients became Office, owner 2026-11-19). Began as Clients (item 86,
     v1.58.0): the company's client list, the second Systems product. It owns
     the ShopTimeline_Clients list: it is the one place a client is added, changed or removed.
     It reads Projects, phases (Tasks), Staff and Config, and never writes them. Built to the
     owner's Clients wireframe (design/wireframes/) with the owner's wording of 2026-11-18;
     the shared sign-in, data layer, toasts, sync pill, header and update check come from

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--sans);font-size:13px;line-height:1.45;color:var(--ts-text);background:var(--ts-paper)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
:focus-visible{outline:2px solid var(--ts-action);outline-offset:2px}
.hidden{display:none!important}
button,input{font:inherit;color:inherit}
.grow{flex:1}
/* The shell (common.css): wordmark, name, then the sync pill, Apps and who's signed in. */
.ts-top{position:sticky;top:0;z-index:50}
.top-r{display:flex;align-items:center;gap:14px}
.apps-wrap{position:relative}
.apps-btn{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border:1px solid transparent;border-radius:6px;background:none;color:var(--ts-header-text);font-weight:600;font-size:12px;cursor:pointer}
.apps-btn:hover{background:rgba(255,255,255,.12)}
.apps-btn svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#apps-menu{position:absolute;top:34px;right:0;z-index:60;min-width:200px;padding:8px;background:var(--ts-panel);border:1px solid var(--ts-line);border-radius:var(--ts-radius-dialog);box-shadow:var(--ts-shadow-floating);display:flex;flex-direction:column;gap:2px}
#who{font-size:11px;color:rgba(255,255,255,.75);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
/* The page (guide §5: 28/32 padding, 22px title, 32px buttons, 36px fields, 8px panels). */
main{max-width:1240px;margin:0 auto;padding:28px 32px 48px}
.head{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px}
h1{font-size:22px;line-height:1.25;font-weight:600}
.sub{color:var(--ts-muted);margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:32px;padding:0 14px;border-radius:var(--ts-radius-control);text-decoration:none;border:1px solid var(--ts-line);background:var(--ts-panel);font-weight:600;cursor:pointer}
.btn:hover{background:var(--ts-selected)}
.btn.primary{background:var(--ts-action);border-color:var(--ts-action);color:var(--ts-on-action)}
.btn.primary:hover{background:var(--ts-action-hover)}
.btn.danger{color:var(--ts-danger-text);border-color:transparent;background:none;padding:0 6px}
.btn.danger:hover{background:var(--ts-danger-bg)}
.link{min-height:24px;background:none;border:0;padding:2px 0;color:var(--ts-link);cursor:pointer} /* 24px hit target */
.link:hover{text-decoration:underline}
#q{display:block;width:100%;height:36px;padding:0 10px;margin-bottom:16px;border:1px solid var(--ts-control-line);border-radius:6px;background:var(--ts-panel)}
.body{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
/* item 92: the list scrolls on its own and stays beside the record (sticky under the 56px header). */
.list{list-style:none;background:var(--ts-panel);border:1px solid var(--ts-line);border-radius:8px;overflow:auto;overscroll-behavior:contain;position:sticky;top:72px;max-height:calc(100vh - 88px)}
.list li+li{border-top:1px solid var(--ts-line)}
.row{display:block;width:100%;text-align:left;padding:12px 14px;background:none;border:0;cursor:pointer}
.row:hover{background:var(--ts-paper)}
.row[aria-current="true"]{background:var(--ts-selected);box-shadow:inset 3px 0 var(--ts-action)}
.row b{font-weight:600}
.alias{font-family:var(--mono);font-size:12px;color:var(--ts-link)}
.mut{font-size:12px;color:var(--ts-muted)}
.empty{padding:16px 14px;color:var(--ts-muted)}
.rec{background:var(--ts-panel);border:1px solid var(--ts-line);border-radius:8px}
.rec-top{padding:18px 20px;border-bottom:1px solid var(--ts-line)}
.rec-top h2{font-size:17px;line-height:1.35;font-weight:600}
.sec{padding:16px 20px}
.sec+.sec{border-top:1px solid var(--ts-line)}
.sec-h{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.sec-h h3{font-size:13px;font-weight:600}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px}
.kv dt{color:var(--ts-muted)}
.projs{list-style:none}
.proj{display:flex;align-items:flex-start;gap:12px;padding:12px 0;color:inherit;text-decoration:none}
.projs li+li .proj{border-top:1px solid var(--ts-line)}
.proj .nm{color:var(--ts-link);font-weight:600}
.proj:hover .nm,.hist a:hover{text-decoration:underline}
.proj .meta{font-family:var(--mono);font-size:12px;color:var(--ts-muted)}
.proj .now{font-size:12px;margin-top:2px}
.proj .side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;white-space:nowrap}
/* Status pills: Timeline's recipe and colours (Style-Guide §2.8). */
.st-pill{font-family:var(--mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:9px;background:#EEF2F7;color:#33415A}
.st-pill[data-st="estimating"]{background:#EEEDFE;color:#534AB7}
.st-pill[data-st="in-design"]{background:#EDE9FE;color:#5B21B6}
.st-pill[data-st="in-fabrication"]{background:#E1F5EE;color:#0F6E56}
.st-pill[data-st="on-hold"]{background:#FFEDD5;color:#9A3412}
.hist-wrap{overflow-x:auto}
.hist{width:100%;border-collapse:collapse}
.hist th{text-align:left;font-size:12px;font-weight:600;color:var(--ts-muted);padding:0 12px 6px 0;border-bottom:1px solid var(--ts-line)}
.hist td{padding:8px 12px 8px 0;vertical-align:top;border-bottom:1px solid var(--ts-line)}
.hist tr:last-child td{border-bottom:0}
.hist a{color:var(--ts-link);text-decoration:none}
.hist .code,.hist .dates{font-family:var(--mono);font-size:12px;white-space:nowrap}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:12px;font-weight:600;margin-bottom:4px}
.field input{width:100%;height:36px;padding:0 10px;border:1px solid var(--ts-control-line);border-radius:6px}
.field textarea{width:100%;min-height:64px;padding:8px 10px;border:1px solid var(--ts-control-line);border-radius:6px;font:inherit;resize:vertical}
.hist .link{padding:0;text-align:left;font:inherit}
.hist .st-pill{margin-left:6px;white-space:nowrap}
.field small{display:block;margin-top:4px;font-size:11px;color:var(--ts-muted)}
.foot{display:flex;align-items:center;gap:8px;margin-top:6px}
.note{max-width:560px;padding:20px;background:var(--ts-panel);border:1px solid var(--ts-line);border-radius:8px}
.note h2{font-size:17px;font-weight:600;margin-bottom:6px}
.note p{color:var(--ts-muted);margin-bottom:14px}
/* The sign-in-expired box (the same words as Timeline's). */
.overlay{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:rgba(8,15,26,.5)}
.modal{width:440px;max-width:94vw;padding:22px 24px;background:var(--ts-panel);border-radius:10px;box-shadow:0 28px 90px rgba(5,15,30,.3)}
.modal h3{font-size:15px;font-weight:600;margin-bottom:8px}
.modal p{color:var(--ts-muted);margin-bottom:16px}
.modal .foot{justify-content:flex-end}
@media (max-width:760px){main{padding:24px 16px 40px}.body{grid-template-columns:1fr}.head{flex-wrap:wrap}#who{display:none}.list{position:static;max-height:40vh}}
</style>

<header class="ts-top">
  <a class="ts-brand" href="../" aria-label="TwoSeven Inc. home, all apps" title="All apps — the Systems page">TWOSEVEN INC.</a>

    <span class="apps-wrap">
      <button id="btn-apps" class="apps-btn" title="Switch to another Systems app" aria-expanded="false" aria-controls="apps-menu">Apps <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6 8 9.5 11.5 6"/></svg></button>

<main id="main"></main>
<div id="toasts" aria-live="polite"></div>
<div id="auth-overlay" class="overlay hidden">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="auth-h">
    <h3 id="auth-h">Your sign-in expired</h3>
    <p>Office paused while you were away. Sign in to pick up where you left off. Anything you changed is still on screen and saves once you're back.</p>
    <div class="foot"><button id="auth-signin" class="btn primary">Sign in</button></div>
  </div>
</div>
<script src="../common/msal-browser.min.js"></script>
<script src="../common/common.js?v=1.62.2"></script>
<script>
const APP_VER='1.62.2'; // stamped from Timeline's by `npm run notes`: one version for every product
const POLL_MS=90000;     // the same freshness knob as Timeline's
let CLIENTS=[],PEOPLE=[],PROJECTS=[],TASKS=[];
let LOADED=false,SEL=null,EDIT=null,Q='',SAVING=0,PENDING=null;
let GEN=0; /* bumped by every save: a refresh fetched before it must not put the old list back */
let PROJ_OK=false; /* the projects were read: until then no count is shown, so none reads as "no projects" */
let PAST=[],PAST_OK=false,PAST_RETRY=[]; /* item 93: projects from before Timeline; no list, no add button */

/* ===================== DATA ===================== */
/* Which client a project carries: its stable ID when the project has one (item 28), else
   the one client with that exact name, ignoring case. */
function clientOf(p){
  const id=p.refs&&p.refs.client&&p.refs.client[p.client];
  if(id){const c=CLIENTS.find(x=>x.spId===id);if(c)return c;}
  const low=String(p.client||'').trim().toLowerCase(),hit=low?CLIENTS.filter(c=>c.name.trim().toLowerCase()===low):[];
  return hit.length===1?hit[0]:null;
}
/* Every client's projects, with each one's status and due date: worked out once per paint
   (a client's row and its record both read it), not once per row. */
let IDX=new Map();
function reindex(){
  const t=today(),byProj=new Map();
  for(const x of TASKS){if(!byProj.has(x.projectId))byProj.set(x.projectId,[]);byProj.get(x.projectId).push(x);}
  IDX=new Map();
  for(const p of PROJECTS){const c=clientOf(p);if(!c)continue;
    const ts=byProj.get(p.id)||[],due=dueOf(ts);
    /* item 92: its dates run from the first phase's start to the due date (else the last phase's end) */
    const start=ts.reduce((m,x)=>x.startDate&&(!m||x.startDate<m)?x.startDate:m,'');
    const end=due?due.d:ts.reduce((m,x)=>x.endDate>m?x.endDate:m,'');
    if(!IDX.has(c))IDX.set(c,[]);
    IDX.get(c).push({p,ts,status:statusOf(p,ts,t),due:due?due.d:'',start,end});}
}
const projectsOf=c=>IDX.get(c)||[];
const plural=(n,one,many)=>n+' '+(n===1?one:many);
function currentLine(c){if(!PROJ_OK)return '';const n=projectsOf(c).filter(x=>x.status!=='complete').length;
  return n?plural(n,'current project','current projects'):'No current projects';}
const niceDay=s=>parseDate(s).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const shortDay=s=>parseDate(s).toLocaleDateString('en-US',{month:'short',day:'numeric'});
/* "Oct 6 – Dec 12, 2026", or both years when they differ; one end alone reads as that day. */
function span(a,b){
  if(!a||!b||a===b)return a||b?niceDay(a||b):'';
  return (a.slice(0,4)===b.slice(0,4)?shortDay(a):niceDay(a))+' – '+niceDay(b);
}
const names=v=>String(v||'').split(',').map(s=>s.trim()).filter(Boolean);
/* A person reads as their nickname when they have one, as in Timeline (its dispName). */
const disp=n=>{const p=PEOPLE.find(x=>x.name===n);return (p&&p.nickname&&String(p.nickname).trim())||n;};
const dayIn=s=>s.slice(0,4)===String(today().getFullYear())?shortDay(s):niceDay(s);
const phaseName=x=>{const d=deptById(x.department);return (d&&d.freeText&&x.label)||(d?d.name:x.department);};
/* What a current project is doing: the phases running today, then the next one to start. */
function nowNext(ts){
  const t=fmtDate(today()),now=[...new Set(ts.filter(x=>x.startDate&&x.startDate<=t&&x.endDate>=t).map(phaseName))];
  const nx=ts.filter(x=>x.startDate>t).sort((a,b)=>a.startDate.localeCompare(b.startDate))[0];
  return [now.length?'Now: '+now.join(', '):'',nx?'Next: '+phaseName(nx)+', '+dayIn(nx.startDate):''].filter(Boolean).join(' · ');
}
/* The team, in Timeline's words: PM, project lead and technical designer; with crew, everyone
   else on its phases and its fabricators too. ponytail: names() and the crew read mirror
   Timeline's roleList()/crewOf(); move them to common/ if a third product needs them. */
function teamOf(x,crew){
  const p=x.p,roles=[['PM',p.projectManager],['Project lead',p.leadFab],['Technical Designer',p.drafter]];
  const out=roles.filter(r=>names(r[1]).length).map(r=>r[0]+' '+names(r[1]).map(disp).join(', '));
  if(crew){
    const named=new Set(roles.flatMap(r=>names(r[1])));
    const all=[...names(p.fabricators),...x.ts.flatMap(t=>Array.isArray(t.assignee)?t.assignee:names(t.assignee))];
    const c=[...new Set(all)].filter(n=>n&&n!=='Installation'&&!named.has(n));
    if(c.length)out.push('Crew: '+c.map(disp).join(', '));
  }
  return out.join(' · ');
}
const refsOf=s=>{try{const o=JSON.parse(s);return o&&typeof o==='object'?o:null;}catch(e){return null;}};

const readClients=async()=>(await store.list('client')).map(clientFromItem).filter(c=>c.name);
/* Projects and phases are Timeline's: read here, never written. */
async function loadProjects(){
  const [ps,ts]=await Promise.all([store.list('proj'),store.list('task')]);
  PROJECTS=ps.filter(it=>it.fields.appId).map(it=>({...fieldsToProj(it.fields),refs:refsOf(it.fields.refs)}));
  TASKS=ts.filter(it=>it.fields.appId).map(it=>fieldsToTask(it.fields));
}
/* Item 93: projects from before Timeline. Office (formerly Clients) owns this list. */
const readPast=async()=>(await store.list('past')).map(it=>({spId:it.id,name:it.fields.Title||'',clientId:String(it.fields.clientId??''),
  code:it.fields.jobCode||'',start:isoDay(it.fields.startDate),end:isoDay(it.fields.endDate),team:it.fields.team||''}));
/* Noon UTC: a date-only column keeps the same day in every US time zone. */
const pastToFields=x=>({Title:x.name,clientId:Number(x.clientId),jobCode:x.code,team:x.team,
  startDate:x.start?x.start+'T12:00:00Z':null,endDate:x.end?x.end+'T12:00:00Z':null});
async function loadPast(){try{PAST=await readPast();PAST_OK=true;}catch(e){console.warn('past projects not read',e);}}
async function loadAll(){
  const [c,s,p,g]=await Promise.allSettled([readClients(),store.list('staff'),loadProjects(),readConfig(),loadPast()]);
  if(s.status==='fulfilled')PEOPLE=s.value.map(it=>({name:it.fields.Title||'',email:it.fields.email||'',admin:adminFlag(it.fields.admin),nickname:it.fields.nickname||''}));
  /* The staff list unreachable: the roster Timeline keeps in this browser decides, as it does in
     Timeline — never "no roster, so everyone's an admin" on a blip. */
  else try{PEOPLE=JSON.parse(localStorage.getItem('shopTimelinePeople_v1'))||[];}catch(e){PEOPLE=[];}
  PROJ_OK=p.status==='fulfilled';
  if(g.status==='fulfilled'){SP_CFG_IDS=g.value.ids;CFG_RAW=g.value.raw;}
  if(p.status==='rejected')toast('Couldn\'t read the projects from SharePoint: '+store.explain(p.reason),'err',null,String(p.reason&&p.reason.message));
  if(c.status==='rejected')throw c.reason;
  CLIENTS=c.value;
}

/* ===================== SAVING ===================== */
/* The diff behind a save, moved here from Timeline (the Clients app owns the list now):
   create the new rows, update the changed ones, remove the gone ones. */
const clientToFields=c=>({Title:c.name||'',field_2:c.alias||''});
async function syncClients(o,n){
  const om=new Map(o.filter(c=>c.spId).map(c=>[c.spId,c]));
  for(const c of n){
    if(!c.spId){const r=await store.create('client',clientToFields(c));c.spId=r.id;}
    else{const b=om.get(c.spId);if(!b||b.name!==c.name||b.alias!==c.alias)await store.update('client',c.spId,clientToFields(c));}
  }
  const keep=new Set(n.map(c=>c.spId).filter(Boolean));
  for(const c of o)if(c.spId&&!keep.has(c.spId))await store.remove('client',c.spId);
}
/* Optimistic, like every save in Timeline: the screen changes now, SharePoint follows. A
   failure parks the diff base, and the pill's "click to retry" replays it. */
function saveClients(list){
  GEN++;
  const old=CLIENTS;CLIENTS=list;paint();
  runSync(old,false);
}
function runSync(old,again){
  SAVING++;setSync('busy');
  syncClients(old,CLIENTS)
    .then(()=>{SAVING--;setSync('ok','synced '+stamp());})
    .catch(e=>{SAVING--;console.error(e);
      PENDING={old:again?old:((PENDING&&PENDING.old)||old)};
      setSync('err','clients not saved — click to retry');
      toast(again?'Still couldn\'t save the client list: '+store.explain(e)+' Click "clients not saved" to retry again.'
        :'Couldn\'t save the client list to SharePoint: '+store.explain(e)+' Your change is still on screen — click "clients not saved" at the top right to retry.','err',null,e.message);});
}
function retryPending(){const r=PAST_RETRY;PAST_RETRY=[];r.forEach(runPast);if(!PENDING)return;const p=PENDING;PENDING=null;runSync(p.old,true);}

/* ===================== THE PAGE ===================== */
const M=()=>document.getElementById('main');
function paintShell(){
  const me=staffMe(PEOPLE),w=store.who(),nm=(me&&me.name)||(w&&w.name)||'';
  document.getElementById('who').innerHTML=nm?esc(nm)+(rosterAdmin(PEOPLE)&&PEOPLE.some(p=>p.admin!=null)?'<span class="tb-acc">ADMIN</span>':''):'';
}
function paintFrame(){
  if(!rosterAdmin(PEOPLE)){
    M().innerHTML='<div class="note"><h2>Office is for admins.</h2><p>Ask an admin to add or change a client. You can still pick a project\'s client in Timeline.</p>'
      +'<a class="btn primary" href="../timeline/">Open Timeline</a></div>';
    return;
  }
  M().innerHTML='<div class="head"><div class="grow"><h1>Clients</h1><p class="sub">The company\'s clients and their cost-code aliases.</p></div>'
    +'<button class="btn primary" id="add">+ Add client</button></div>'
    +'<input id="q" type="search" placeholder="Search clients or aliases…" aria-label="Search clients or aliases">'
    +'<div class="body"><ul class="list" id="list" aria-label="Clients"></ul><section class="rec" id="rec" aria-live="polite"></section></div>';
  const q=document.getElementById('q');q.value=Q;
  q.addEventListener('input',()=>{Q=q.value;paintList();});
  document.getElementById('add').addEventListener('click',()=>{
    if(!leaveEdit())return;
    EDIT={name:'',alias:'',_new:true};paintRecord();
    document.getElementById('ce-name').focus();
  });
}
function paint(){
  paintShell();
  if(!LOADED)return;
  reindex();
  if(!document.getElementById('list')&&!document.querySelector('#main .note'))paintFrame();
  if(document.getElementById('list')){paintList();paintRecord();}
}
function paintList(){
  const qq=Q.trim().toLowerCase();
  const rows=[...CLIENTS].sort((a,b)=>a.name.localeCompare(b.name))
    .filter(c=>!qq||[c.name,c.alias].some(v=>String(v||'').toLowerCase().includes(qq)));
  const box=document.getElementById('list');
  box.innerHTML=rows.map(c=>'<li><button class="row" data-name="'+esc(c.name)+'"'+(SEL===c.name?' aria-current="true"':'')+'>'
      +'<b>'+esc(c.name)+'</b>'+(c.alias?'<div class="alias">'+esc(c.alias)+'</div>':'')
      +'<div class="mut">'+esc(currentLine(c))+'</div></button></li>').join('')
    ||'<li class="empty">'+(qq?'No matching clients.':'No clients yet. Add the first one.')+'</li>';
  box.querySelectorAll('.row').forEach(b=>b.addEventListener('click',()=>{
    if(!leaveEdit())return;
    SEL=b.dataset.name;EDIT=null;paintList();paintRecord();}));
}
function paintRecord(){
  const el=document.getElementById('rec');
  if(EDIT){paintEditor(el);return;}
  const c=CLIENTS.find(x=>x.name===SEL);
  if(!c){el.innerHTML='<div class="empty">Select a client to see its record.</div>';return;}
  const all=projectsOf(c),cur=all.filter(x=>x.status!=='complete')
    .sort((a,b)=>String(a.due||'9999').localeCompare(String(b.due||'9999'))||a.p.name.localeCompare(b.p.name));
  const fin=all.filter(x=>x.status==='complete').sort((a,b)=>String(b.end).localeCompare(String(a.end))||a.p.name.localeCompare(b.p.name));
  /* item 93: its projects from before Timeline join the history, by finish date */
  const hist=[...fin.map(x=>({end:x.end,name:x.p.name,x})),...PAST.filter(y=>c.spId&&y.clientId===String(c.spId)).map(y=>({end:y.end,name:y.name,y}))]
    .sort((a,b)=>String(b.end).localeCompare(String(a.end))||a.name.localeCompare(b.name));
  const done=hist.length,pid=p=>encodeURIComponent(p.id);
  const histRow=({x,y})=>x?'<tr><td><a href="../timeline/#/project/'+pid(x.p)+'">'+esc(x.p.name)+'</a></td><td class="code">'+esc(x.p.jobCode||'—')+'</td>'
      +'<td class="dates">'+esc(span(x.start,x.end)||'—')+'</td><td>'+esc(teamOf(x,true)||'—')+'</td></tr>'
    :'<tr><td><button class="link" data-past="'+esc(y.spId)+'">'+esc(y.name)+'</button><span class="st-pill">Before Timeline</span></td><td class="code">'+esc(y.code||'—')+'</td>'
      +'<td class="dates">'+esc(span(y.start,y.end)||'—')+'</td><td>'+esc(y.team.trim()||'—')+'</td></tr>';
  el.innerHTML='<div class="rec-top"><h2>'+esc(c.name)+'</h2>'+(c.alias?'<div class="alias">'+esc(c.alias)+'</div>':'')+'</div>'
    +'<div class="sec"><div class="sec-h"><h3>Details</h3><span class="grow"></span><button class="link" id="edit">Edit client</button></div>'
    +'<dl class="kv"><dt>Client alias</dt><dd'+(c.alias?' class="alias"':'')+'>'+(c.alias?esc(c.alias):'—')+'</dd></dl></div>'
    +'<div class="sec"><div class="sec-h"><h3>Current projects</h3><span class="grow"></span>'+(all.length?'<span class="mut">'+all.length+' in all</span>':'')+'</div>'
    +(cur.length?'<ul class="projs">'+cur.map(x=>{
        const p=x.p,dates=x.due?span(x.start,x.due)+' (due)':x.start?'from '+niceDay(x.start):'';
        const meta=[p.jobCode,dates].filter(Boolean).join(' · '),now=x.status==='on-hold'?'':nowNext(x.ts),team=teamOf(x,false);
        return '<li><a class="proj" href="../timeline/#/project/'+pid(p)+'"><span class="grow"><span class="nm">'+esc(p.name)+'</span>'
          +(meta?'<div class="meta">'+esc(meta)+'</div>':'')+(now?'<div class="now">'+esc(now)+'</div>':'')
          +(team?'<div class="mut team">'+esc(team)+'</div>':'')+'</span>'
          +'<span class="side"><span class="st-pill" data-st="'+esc(x.status)+'">'+esc(STATUS_LBL[x.status]||x.status)+'</span>'
          +'<span class="mut">Open in Timeline →</span></span></a></li>';}).join('')+'</ul>'
      :'<p class="mut">'+(!PROJ_OK?'Couldn\'t read the projects from SharePoint.':all.length?'Not on any current project. '+done+' finished.':'Not on any project yet.')+'</p>')
    +'</div>'
    /* item 92: every finished project, newest first, with its cost code, dates and team. */
    +(PROJ_OK?'<div class="sec"><div class="sec-h"><h3>Project history</h3><span class="grow"></span>'+(done?'<span class="mut">'+done+' finished, newest first</span>':'')
      +(PAST_OK&&c.spId?'<button class="link" id="add-past">+ Add a past project</button>':'')+'</div>'
      +(done?'<div class="hist-wrap"><table class="hist"><thead><tr><th scope="col">Project</th><th scope="col">Cost code</th><th scope="col">Dates</th><th scope="col">Team</th></tr></thead><tbody>'
        +hist.map(histRow).join('')
        +'</tbody></table></div>':'<p class="mut">No finished projects yet.</p>')+'</div>':'');
  document.getElementById('edit').addEventListener('click',()=>{EDIT={name:c.name,alias:c.alias,_orig:c.name};paintRecord();document.getElementById('ce-name').focus();});
  const openPast=r=>{EDIT={kind:'past',client:c.name,clientId:String(c.spId),name:'',code:'',start:'',end:'',team:'',...r};paintRecord();document.getElementById('pe-name').focus();};
  const ap=document.getElementById('add-past');if(ap)ap.addEventListener('click',()=>openPast({_new:true}));
  el.querySelectorAll('[data-past]').forEach(b=>b.addEventListener('click',()=>{
    const y=PAST.find(z=>z.spId&&z.spId===b.dataset.past);if(y)openPast({...y,_orig:y.name});})); /* no ID yet: its save is still going */
}
/* Item 93: a project from before Timeline. Saved like a client: the screen changes now, and
   a failed save stays on screen, retried from the sync pill. */
function paintPastEditor(el){
  const r=EDIT,F={'pe-name':'name','pe-code':'code','pe-start':'start','pe-end':'end','pe-team':'team'};
  const f=(id,label,type,ph)=>'<label class="field"><span>'+label+'</span>'+(type==='area'?'<textarea id="'+id+'" placeholder="'+ph+'"></textarea>'
    :'<input id="'+id+'" type="'+type+'" autocomplete="off">')+'</label>';
  el.innerHTML='<div class="rec-top"><h2>Past project</h2></div><div class="sec">'
    +f('pe-name','Project name','text')+f('pe-code','Cost code','text')+f('pe-start','Started','date')+f('pe-end','Finished','date')
    +f('pe-team','Team','area','PM, project lead, designer, crew')
    +'<div class="foot">'+(r._new?'':'<button class="btn danger" id="pe-del">Remove…</button>')
    +'<span class="grow"></span><button class="btn" id="pe-cancel">Cancel</button><button class="btn primary" id="pe-save">Save</button></div></div>';
  for(const id in F){const i=document.getElementById(id);i.value=r[F[id]]||'';
    i.addEventListener('input',()=>{r[F[id]]=i.value;r._dirty=true;});
    if(i.tagName==='INPUT')i.addEventListener('keydown',ev=>{if(ev.key==='Enter')savePast();});}
  document.getElementById('pe-cancel').addEventListener('click',()=>{EDIT=null;paintRecord();});
  document.getElementById('pe-save').addEventListener('click',savePast);
  const del=document.getElementById('pe-del');if(del)del.addEventListener('click',removePast);
}
function writePast(next,call){GEN++;PAST=next;paint();runPast(call);}
/* ponytail: failed calls replay in order; safe because a row can't be changed until its create lands (it has no ID) */
function runPast(call){
  SAVING++;setSync('busy');
  call().then(()=>{SAVING--;if(!PAST_RETRY.length&&!PENDING)setSync('ok','synced '+stamp());})
    .catch(e=>{SAVING--;console.error(e);PAST_RETRY.push(call);setSync('err','past projects not saved — click to retry');
      toast('Couldn\'t save the past project to SharePoint: '+store.explain(e)+' Your change is still on screen — click "past projects not saved" at the top right to retry.','err',null,String(e&&e.message));});
}
function savePast(){
  const r=EDIT;if(!r)return;
  const name=(r.name||'').trim();
  if(!name){toast('Give the project a name first.','err');return;}
  const row={spId:r.spId||'',clientId:r.clientId,name,code:(r.code||'').trim(),start:r.start||'',end:r.end||'',team:(r.team||'').trim()};
  EDIT=null;
  if(r._new)writePast([...PAST,row],()=>store.create('past',pastToFields(row)).then(res=>{if(res&&res.id){row.spId=String(res.id);paint();}}));
  /* a retry sends the row as it is then (a later edit wins; a removed row is skipped) */
  else writePast(PAST.map(y=>y.spId===row.spId?row:y),()=>{const cur=PAST.find(y=>y.spId===row.spId);return cur?store.update('past',cur.spId,pastToFields(cur)):Promise.resolve();});
  toast(name+' saved');
}
function removePast(){
  const r=EDIT;if(!r||r._new)return;
  if(!confirm('Remove '+r._orig+' from '+r.client+'\'s history?'))return;
  EDIT=null;
  writePast(PAST.filter(y=>y.spId!==r.spId),()=>store.remove('past',r.spId));
  toast(r._orig+' removed');
}
function paintEditor(el){
  const r=EDIT;
  if(r.kind==='past'){paintPastEditor(el);return;}
  el.innerHTML='<div class="rec-top"><h2>'+(r._new?'New client':esc(r._orig))+'</h2></div><div class="sec">'
    +'<label class="field"><span>Client name</span><input id="ce-name" type="text" autocomplete="off"></label>'
    +'<label class="field"><span>Client alias</span><input id="ce-alias" type="text" maxlength="6" autocomplete="off" placeholder="2–3 letter cost-code prefix"></label>'
    +'<div class="foot">'+(r._new?'':'<button class="btn danger" id="ce-del">Remove client…</button>')
    +'<span class="grow"></span><button class="btn" id="ce-cancel">Cancel</button><button class="btn primary" id="ce-save">Save</button></div></div>';
  const nm=document.getElementById('ce-name'),al=document.getElementById('ce-alias');
  nm.value=r.name||'';al.value=r.alias||'';
  nm.addEventListener('input',()=>{r.name=nm.value;r._dirty=true;});
  al.addEventListener('input',()=>{r.alias=al.value;r._dirty=true;});
  el.querySelectorAll('input').forEach(i=>i.addEventListener('keydown',ev=>{if(ev.key==='Enter')saveEdit();}));
  document.getElementById('ce-cancel').addEventListener('click',()=>{EDIT=null;paintRecord();});
  document.getElementById('ce-save').addEventListener('click',saveEdit);
  const del=document.getElementById('ce-del');if(del)del.addEventListener('click',removeClient);
}
/* Leaving a record mid-edit asks first (Timeline's rule for its record pages). */
function leaveEdit(){
  if(!EDIT||!EDIT._dirty)return true;
  if(!confirm('Discard the changes to this '+(EDIT.kind==='past'?'past project':'client')+'?'))return false;
  EDIT=null;return true;
}
function saveEdit(){
  const r=EDIT;if(!r)return;
  const name=(r.name||'').trim(),alias=(r.alias||'').trim().toUpperCase();
  if(!name){toast('Give the client a name first.','err');return;}
  const orig=r._orig||null;
  if(CLIENTS.some(c=>c.name.trim().toLowerCase()===name.toLowerCase()&&c.name!==orig)){
    toast('Two clients share the name "'+name+'". Please make names unique.','err');return;}
  const list=orig?CLIENTS.map(c=>c.name===orig?{...c,name,alias}:c):[...CLIENTS,{name,alias}];
  EDIT=null;SEL=name;
  saveClients(list);
  toast(name+' saved');
}
function removeClient(){
  const r=EDIT;if(!r||r._new)return;
  const orig=r._orig,c=CLIENTS.find(x=>x.name===orig),n=c?projectsOf(c).length:0;
  const warn=(n?n+' project'+(n===1?' carries':'s carry')+' this client. They keep the client\'s name; only the list entry and its alias go away.\n\n':'')
    +'Remove '+orig+' from the client list?';
  if(!confirm(warn))return;
  EDIT=null;SEL=null;
  saveClients(CLIENTS.filter(x=>x.name!==orig));
  toast(orig+' removed');
}

/* ===================== HOOKS FOR common/ ===================== */
/* The update check's three (item 85 (b)): a reload never costs an edit or a save. */
function updWhyNot(){
  if(SAVING)return 'a save is still going — try again in a moment';
  if(PENDING||PAST_RETRY.length)return 'a save hasn’t reached SharePoint yet — click the sync pill to retry, then reload';
  if(EDIT&&EDIT._dirty)return 'finish or cancel the '+(EDIT.kind==='past'?'past project':'client')+' you’re editing first';
  return '';
}
function updBusy(){return !!(updWhyNot()||EDIT);}
function updGo(){location.reload();}

/* ===================== WIRING ===================== */
document.getElementById('sync-pill').addEventListener('click',retryPending);
document.getElementById('tb-rev').textContent='v'+APP_VER; /* item 101: the version, as in Timeline's header */
document.getElementById('auth-signin').addEventListener('click',async()=>{
  const b=document.getElementById('auth-signin');b.disabled=true;
  try{await spLogin();document.getElementById('auth-overlay').classList.add('hidden');setSync('ok','synced '+stamp());retryPending();}
  catch(e){console.error(e);toast('Couldn\'t sign in: '+store.explain(e),'err',null,String(e&&e.message));}
  finally{b.disabled=false;}
});
const appsBtn=document.getElementById('btn-apps'),appsMenu_=document.getElementById('apps-menu');
appsMenu(appsMenu_,'Office','../');
const appsOpen=on=>{appsMenu_.classList.toggle('hidden',!on);appsBtn.setAttribute('aria-expanded',String(on));};
appsBtn.addEventListener('click',ev=>{ev.stopPropagation();appsOpen(appsMenu_.classList.contains('hidden'));});
document.addEventListener('click',ev=>{if(!ev.target.closest('.apps-wrap'))appsOpen(false);});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!appsMenu_.classList.contains('hidden')){appsOpen(false);appsBtn.focus();}});
/* An edit, a save in flight or a parked one: the browser's own "leave site?" warning. */
window.addEventListener('beforeunload',ev=>{if(SAVING||PENDING||PAST_RETRY.length||(EDIT&&EDIT._dirty)){ev.preventDefault();ev.returnValue='';}});

(async()=>{
  try{
    setSync('busy','signing in…');
    await store.signIn();
    setSync('busy','loading…');
    await loadAll();
    LOADED=true;
    setSync('ok','synced '+stamp());
  }catch(e){
    console.error(e);
    setSync('err','offline');
    toast('Couldn\'t sign in or reach SharePoint: '+store.explain(e),'err',null,String(e&&e.message));
    M().innerHTML='<div class="note"><h2>Couldn\'t reach SharePoint.</h2><p>'+esc(store.explain(e))+'</p>'
      +'<button class="btn primary" id="retry">Try again</button></div>';
    document.getElementById('retry').addEventListener('click',()=>location.reload());
  }
  paint();
  updWatch(); /* the update check (common/) */
  /* Other people's changes: the client list every 90 s; projects too when the tab comes back
     into view (their counts change in Timeline). Never mid-edit or mid-save. */
  setInterval(async()=>{
    if(document.hidden||!LOADED||!store.who()||!rosterAdmin(PEOPLE)||updBusy())return; /* a non-admin sees no list */
    try{const g=GEN,fresh=await readClients();
      if(g===GEN&&!updBusy()&&JSON.stringify(fresh)!==JSON.stringify(CLIENTS)){CLIENTS=fresh;paint();}}catch(e){}
  },POLL_MS);
  document.addEventListener('visibilitychange',async()=>{
    if(document.visibilityState!=='visible'||!LOADED||!store.who()||updBusy())return;
    try{const g=GEN,[fresh,,past]=await Promise.all([readClients(),loadProjects(),readPast().catch(()=>null)]);PROJ_OK=true;
      if(g===GEN&&!updBusy()){CLIENTS=fresh;if(past){PAST=past;PAST_OK=true;}paint();}}catch(e){}
  });
})();
</script>
