<!-- People (item 87, v1.62.0): the company roster, the third Systems product. Timeline's People
     page (v1.7.0 on) moved here unchanged, under the shared header, with the owner's wording of
     2026-11-19. It owns the ShopTimeline_Staff list: the one place a person is added, changed,
     merged or removed (Timeline still writes a person's own row: notes, saved views). It reads

<script>
const APP_VER='1.62.8'; // stamped from Timeline's by `npm run notes`: one version for every product
const POLL_MS=90000;     // the same freshness knob as Timeline's
let PEOPLE=[],PROJECTS=[],TASKS=[];
let LOADED=false,SAVING=0,PENDING=null,RETRY=[];
let GEN=0; /* bumped by every save: a refresh fetched before it must not put the old roster back */
let PROJ_OK=false; /* the projects and phases were read: until then no phase count is shown, so none reads as "none" */
let IMPORTING=false; /* an import is running: a repaint mid-import keeps its button disabled */
let SPIDS={},RAW_PHONE={}; /* a person's SharePoint item id, and the phone their row holds on the list */
let CD_Q='',CD_DEPT='all',CD_PF='all',CD_SEL=null,CD_EDIT=null;

/* ===================== RULES ===================== */
/* Timeline's, unchanged: the roster's admin rule (common/), the permission columns, a private
   time-off note, HR's title codes and the coarse people departments. */
function isAdmin(){return rosterAdmin(PEOPLE);}
function permsLive(){return PEOPLE.some(p=>p.admin!=null||p.feedbackRecipient!=null);}
/* v1.44.0 (item 4): a time-off note is private — only admins see it; everyone else sees the dates. */
function oooNote(o){return o&&o.note&&isAdmin()?String(o.note):'';}
/* v1.17.0 (owner): HR titles arrive as "SFAB1 - Seasonal Fabricator" — hide the code prefix
   wherever a title is DISPLAYED; the stored value keeps it. */
const cdTitle=t=>String(t||'').replace(/^[A-Z0-9]{2,}(\s+-\s*|\s*-\s+)/,'');
function cdDeptLbl(id){const m=SM_DEPTS.find(x=>x[0]===pdCanon(id));return m?m[1]:id;}
/* v1.22.0: a weekly schedule reads as "M-F 9-6" or "T-W-Th 11-4": the full weekday week
   collapses to M-F, anything else lists days; hours drop the :00 and the am/pm. */
const SCH_DAYS=[[1,'M'],[2,'T'],[3,'W'],[4,'Th'],[5,'F'],[6,'Sa'],[0,'Su']];
function sch12(t,ampm){if(!t)return '';const[H,M]=t.split(':').map(Number);
  return (H%12||12)+(M||ampm?':'+String(M).padStart(2,'0'):'')+(ampm?(H<12?' AM':' PM'):'');}
function schedFmt(s){
  if(!s)return '';
  const on=SCH_DAYS.filter(d=>(s.days||[]).includes(d[0]));
  const days=on.length===5&&on.every(d=>d[0]>=1&&d[0]<=5)?'M-F':on.map(d=>d[1]).join('-');
  const hrs=s.start&&s.end?sch12(s.start)+'-'+sch12(s.end):sch12(s.start||s.end);
  return [days,hrs].filter(Boolean).join(' ');}
/* v1.23.0: a freelancer has no set week */
function schedTxt(p){return p.freelance?'Freelance':schedFmt(p.schedule);}
/* Typed time → 'HH:MM' snapped to the half hour ('' if unreadable). Accepts 9, 9:30, 5pm,
   5:30 PM, 17:00.
   ponytail: a bare 1–6 reads as afternoon — no shift here starts at 3 AM; type "am" to override. */
function schedParse(v){
  const m=String(v||'').trim().toLowerCase().match(/^(\d{1,2})(?:[:.](\d{1,2}))?\s*(a|p)?\.?m?\.?$/);
  if(!m)return '';
  let H=+m[1],M=+(m[2]||0);if(H>23||M>59)return '';
  if(m[3]==='p'&&H<12)H+=12;else if(m[3]==='a'&&H===12)H=0;else if(!m[3]&&H>=1&&H<=6)H+=12;
  M=Math.round(M/30)*30;if(M===60){M=0;H=(H+1)%24;}
  return String(H).padStart(2,'0')+':'+String(M).padStart(2,'0');}
/* Current-vs-upcoming availability, from the person's OOO ranges. */
function cdAvail(per){
  const t=fmtDate(today());
  const cur=(per.ooo||[]).find(o=>o.start&&o.end&&o.start<=t&&t<=o.end);
  if(cur){
    /* item 19: back-to-back or overlapping ranges read as one absence — keep extending while another
       range starts by the next workday after this end (a weekend or holiday in between still counts) */
    let end=cur.end,grew=true;
    while(grew){grew=false;
      let d=addDays(parseDate(end),1);while(!isWorking(d))d=addDays(d,1);const lim=fmtDate(d);
      for(const o of per.ooo)if(o.start&&o.end&&o.start<=lim&&o.end>end){end=o.end;grew=true;}}
    return{now:true,txt:'Away until '+fmtNice(end)};
  }
  /* v1.18.0 (owner): manual flag for freelancers — an active OOO range outranks it */
  if(per.availability==='unavailable')return{now:true,off:true,txt:'Not available'};
  const nx=(per.ooo||[]).filter(o=>o.start&&o.start>t).sort((a,b)=>a.start.localeCompare(b.start))[0];
  if(nx)return{now:false,txt:'OOO '+fmtNice(nx.start)+' – '+fmtNice(nx.end)};
  return{now:false,txt:'Available'};
}
const cdAvailCls=av=>av.off?' off':av.now?' away':'';
/* Who works a phase: its own crew, else the project's team for that department's role
   (Timeline's barCrew; ponytail: mirrored here, move it to common/ if a third product needs it). */
function barCrew(t){const c=crewOf(t);if(c.length)return [...new Set(c)];
  const p=PROJECTS.find(x=>x.id===t.projectId);return [...new Set(p?roleListFor(p,t.department):[])];}
/* The phases a person is on — read from Timeline's data, never written. Null while the projects
   couldn't be read. */
function cdAssignments(name){
  if(!PROJ_OK)return null;
  const t0=fmtDate(today());
  const mine=TASKS.filter(x=>barCrew(x).includes(name));
  return{phases:mine.length,projects:new Set(mine.map(x=>x.projectId)).size,
    active:mine.filter(x=>x.startDate<=t0&&t0<=x.endDate).length};
}

/* ===================== DATA ===================== */
async function readStaff(){
  const people=[],ids={},raw={};
  for(const it of await store.list('staff')){if(!it.fields.appId)continue;
    ids[it.fields.appId]=it.id;raw[it.fields.appId]=String(it.fields.phone||'');people.push(fieldsToPerson(it.fields));}
  return{people,ids,raw};
}
/* Projects and phases are Timeline's: read here for "On the schedule", never written (the merge
   writes names only, below). */
async function loadProjects(){
  const [ps,ts]=await Promise.all([store.list('proj'),store.list('task')]);
  PROJECTS=ps.filter(it=>it.fields.appId).map(it=>fieldsToProj(it.fields));
  TASKS=ts.filter(it=>it.fields.appId).map(it=>fieldsToTask(it.fields));
}
async function loadAll(){
  const [s,p,g]=await Promise.allSettled([readStaff(),loadProjects(),readConfig()]);
  if(g.status==='fulfilled'){SP_CFG_IDS=g.value.ids;CFG_RAW=g.value.raw;}
  PROJ_OK=p.status==='fulfilled';
  if(p.status==='rejected')toast('Couldn\'t read the projects from SharePoint: '+store.explain(p.reason),'err',null,String(p.reason&&p.reason.message));
  if(s.status==='rejected')throw s.reason;
  PEOPLE=s.value.people;SPIDS=s.value.ids;RAW_PHONE=s.value.raw;
}

/* ===================== SAVING ===================== */
/* The diff behind a save, Timeline's spSyncStaff: create the new rows, update the changed ones,
   remove the gone ones. v1.15.2: every row is attempted; failures aggregate into one error. */
async function syncStaff(olds,news){
  const om=new Map(olds.map(x=>[x.id,x])),nm=new Map(news.map(x=>[x.id,x]));
  const errs=[];
  for(const[id,n]of nm){
    try{
      const o=om.get(id);
      if(!o&&!SPIDS[id]){const r=await store.create('staff',personToFields(n));SPIDS[id]=r.id;}
      else if(!o||JSON.stringify(o)!==JSON.stringify(n)){await store.update('staff',SPIDS[id],personToFields(n));}
      else continue;
      RAW_PHONE[id]=String(n.phone||''); /* v1.43.0 (9c): what the row now holds */
    }catch(e){errs.push((n.name||id)+': '+((e&&e.message)||e));}
  }
  for(const[id]of om)if(!nm.has(id)&&SPIDS[id]){ /* a row never created on the list has nothing to delete */
    try{await store.remove('staff',SPIDS[id]);delete SPIDS[id];}
    catch(e){errs.push('removing '+((om.get(id)||{}).name||id)+': '+((e&&e.message)||e));}
  }
  if(errs.length)throw new Error(errs.length+' staff row'+(errs.length===1?'':'s')+' didn\'t save — '+errs[0]+(errs.length>1?' (+'+(errs.length-1)+' more in the console)':''));
}
/* Optimistic, as in Timeline: the screen changes now, SharePoint follows. A failure parks the
   diff base (and any continuation, the merge's renames), and the pill's "click to retry"
   replays it. Resolves true when THIS save landed. */
function savePeople(np){
  if(!isAdmin()){toast('View-only access — ask an admin to make changes.','err');return Promise.resolve(false);}
  GEN++;
  const old=PEOPLE;PEOPLE=np;paint();
  return runSync(old,false);
}
function runSync(old,again,after){
  SAVING++;setSync('busy');
  return syncStaff(old,PEOPLE)
    .then(()=>{SAVING--;
      if(after)after();
      if(!PENDING&&!RETRY.length)setSync('ok','synced '+stamp());
      return true;})
    .catch(e=>{SAVING--;console.error(e);
      PENDING={old:again?old:((PENDING&&PENDING.old)||old),after:after||(PENDING&&PENDING.after)};
      setSync('err','staff not saved — click to retry');
      toast(again?'Still couldn\'t save the staff list: '+store.explain(e)+' Click "staff not saved" to retry again.'
        :'Couldn\'t save some of the staff list to SharePoint: '+store.explain(e)+' Your edits are still on screen — click "staff not saved" at the top right to retry.','err',null,e.message);
      return false;});
}
/* One record at a time outside Staff (the phone tidy's rows, the merge's renames): a failed call
   waits on the pill and replays in order. */
function runCall(call,what){
  SAVING++;setSync('busy');
  return call().then(()=>{SAVING--;if(!PENDING&&!RETRY.length)setSync('ok','synced '+stamp());return true;})
    .catch(e=>{SAVING--;console.error(e);RETRY.push([call,what]);setSync('err',what+' not saved — click to retry');
      toast('Couldn\'t save the '+what+' to SharePoint: '+store.explain(e)+' Click "'+what+' not saved" at the top right to retry.','err',null,String(e&&e.message));
      return false;});
}
function retryPending(){
  const r=RETRY;RETRY=[];r.forEach(([c,w])=>runCall(c,w));
  if(!PENDING)return;const p=PENDING;PENDING=null;runSync(p.old,true,p.after);
}

/* ===================== THE MERGE (item 87, the owner's pick: People rewrites the names) =====================
   v1.15.0 (owner): two roster entries are the same human ("Dean Baek" and "Donghyun (Dean) Baek")
   — usually an HR-import name meeting a hand-typed one. Keep the OPEN record and fold the picked
   duplicate in: every name on Timeline's projects (the four role fields), phases (the crew) and
   to-dos (the assignees) that means the duplicate — linked to it by ID (item 28), or spelled
   exactly like it — becomes the kept person, linked to them. Missing details backfill from the
   duplicate, and its row leaves the roster.
   Only the name fields and refs are written, one record at a time, so an edit someone makes to
   anything else on that record at the same moment is never overwritten. Free-text departments'
   crews are labels, not people, and are skipped (Timeline's mapRecNames rule).
   ponytail: the field list mirrors Timeline's mapRecNames; a new people field on those lists
   has to be added in both. */
const MERGE_LISTS=[
  ['proj',it=>['projectManager','drafter','leadFab','fabricators'].map(k=>[k,'csv'])],
  ['task',it=>{const d=deptById(it.fields.department);if(d&&d.freeText)return [];
    return [['assignee',String(it.fields.assignee||'').trim().startsWith('[')?'json':'csv']];}],
  ['todo',()=>[['assignees','json']]]];
const refsOf=s=>{try{const o=JSON.parse(s);return o&&typeof o==='object'?o:null;}catch(e){return null;}};
/* The renames for one list: [{id, fields, n}] where n counts the fields that change. */
function mergePlan(items,fieldsOf,dup,keep,hasRefs){
  const out=[];
  for(const it of items){
    const f=it.fields,R=refsOf(f.refs)||{},people=R.people||{};
    const isDup=n=>people[n]===dup.id||String(n).trim()===dup.name.trim();
    const ch={};let n=0;
    for(const[k,kind]of fieldsOf(it)){
      const v=f[k];if(v==null||v==='')continue;
      const arr=kind==='json'?safeArr(v):roleList(v);
      if(!arr.some(x=>x!=='Installation'&&isDup(x)))continue;
      const next=[...new Set(arr.map(x=>x!=='Installation'&&isDup(x)?keep.name:x))];
      ch[k]=kind==='json'?JSON.stringify(next):next.join(', ');n++;
    }
    if(!n)continue;
    if(hasRefs){const p={};
      for(const nm in people)if(people[nm]!==dup.id&&nm.trim()!==dup.name.trim())p[nm]=people[nm];
      p[keep.name]=keep.id;
      ch.refs=JSON.stringify({...R,people:p});}
    out.push({id:it.id,fields:ch,n});
  }
  return out;
}
async function mergeReadAll(dup,keep){
  const read=await Promise.all(MERGE_LISTS.map(([kind,fieldsOf])=>Promise.all([
    store.list(kind).catch(e=>{if(kind==='todo')return [];throw e;}), /* the to-do list is optional */
    store.columns(kind).then(c=>c.some(x=>x.name==='refs'),()=>false)])
    .then(([items,hasRefs])=>mergePlan(items,fieldsOf,dup,keep,hasRefs).map(p=>({kind,...p})))));
  return read.flat();
}
async function cdMergePerson(keepId,dupId){
  const keep=PEOPLE.find(p=>p.id===keepId),dup=PEOPLE.find(p=>p.id===dupId);
  if(!keep||!dup||keep.id===dup.id)return;
  let plans;
  try{plans=await mergeReadAll(dup,keep);} /* dry run for the count */
  catch(e){toast('Couldn\'t read the projects to merge: '+store.explain(e)+' Nothing was changed.','err',null,String(e&&e.message));return;}
  const n=plans.reduce((a,p)=>a+p.n,0);
  if(!confirm('Fold "'+dup.name+'" into "'+keep.name+'"?\n\n'
    +(n?n+' stored assignment field'+(n===1?'':'s')+' will be rewritten to "'+keep.name+'".\n':'No stored assignments carry "'+dup.name+'".\n')
    +'Missing contact details on "'+keep.name+'" fill in from the duplicate, and its roster row is removed.\n\nThis can\'t be un-merged automatically.'))return;
  const take=(a,b)=>String(a||'').trim()?a:(b==null?a:b);
  const merged={...keep,
    email:take(keep.email,dup.email),phone:take(keep.phone,dup.phone),ext:take(keep.ext,dup.ext),
    role:take(keep.role,dup.role),nickname:take(keep.nickname,dup.nickname),
    status:keep.status!=null?keep.status:dup.status,
    personalNotes:take(keep.personalNotes,dup.personalNotes),
    depts:[...new Set([...(keep.depts||[]),...(dup.depts||[])].map(pdCanon))],
    ooo:[...(keep.ooo||[]),...(dup.ooo||[])],
    admin:(keep.admin||dup.admin)?true:(keep.admin==null&&dup.admin==null?null:false),
    developer:!!(keep.developer||dup.developer),
    driver:(keep.driver||dup.driver)?true:(keep.driver==null&&dup.driver==null?null:false),
    availability:keep.availability!=null?keep.availability:dup.availability,
    schedule:keep.schedule!=null?keep.schedule:dup.schedule,
    freelance:(keep.freelance||dup.freelance)?true:(keep.freelance==null&&dup.freelance==null?null:false),
    feedbackRecipient:(keep.feedbackRecipient||dup.feedbackRecipient)?true
      :(keep.feedbackRecipient==null&&dup.feedbackRecipient==null?null:false)};
  CD_EDIT=null;CD_SEL=keep.id;
  /* The renames run only once the roster change lands, or a failed staff save would leave the
     records renamed while both roster rows persist (half-merged). A parked failure carries them
     as its retry continuation. They re-read the records when they write (the count above came
     from the dry run), so a delay or a retry never writes a stale value over someone's edit; a
     record already renamed no longer names the duplicate and is skipped. One call: a failure
     retries the whole pass from the pill. */
  const renames=()=>{
    runCall(async()=>{for(const p of await mergeReadAll(dup,keep))await store.update(p.kind,p.id,p.fields);},'renames');
    /* this browser's phase counts follow at once; Timeline reads the new names on its next refresh */
    TASKS=TASKS.map(t=>{const dd=deptById(t.department),c=crewOf(t);return !(dd&&dd.freeText)&&c.includes(dup.name)?{...t,assignee:[...new Set(c.map(x=>x===dup.name?keep.name:x))]}:t;});
    paint();
    toast('Merged "'+dup.name+'" into "'+keep.name+'"'+(n?' — '+n+' assignment field'+(n===1?'':'s')+' rewritten.':'.'));
  };
  const list=PEOPLE.filter(p=>p.id!==dup.id).map(p=>p.id===keep.id?merged:p);
  GEN++;const old=PEOPLE;PEOPLE=list;paint();
  runSync(old,false,renames);
}

/* ===================== IMPORT FROM EMPLOYEE CONTACTS (v1.13.0) =====================
   The HR list is the identity master (item 13 ruling); this import is the app-side half of the
   parallel-run: READ the HR list (never write it), join on work email (the app's identity chain)
   with an exact-name fallback, then
   - ADD active employees the roster doesn't have (title→role, phone, email, mapped dept)
   - UPDATE matched people: EC wins on title/phone/status; email backfills only when blank;
     departments fill only when the person has NONE set (curated depts win)
   - non-active EC rows never create people; existing people get the status written, nothing is
     removed (retiring someone stays a human call on this page)
   HR-sensitive columns (Pay Type, PersonalEmail) are never read. Everything lands through one
   confirm, so one Cancel aborts the lot. `status` rides only once the Staff column exists. */
function ecNorm(k){return String(k).toLowerCase().replace(/_x0020_/g,'').replace(/[\s_]/g,'');}
function ecField(map,names){for(const n of names){const v=map[n];if(v!=null&&String(v).trim()!=='')return String(v).trim();}return '';}
function ecDept(s){
  const n=String(s||'').trim().toLowerCase();if(!n)return null;
  const d=DEPTS.find(x=>!x.freeText&&x.name.toLowerCase()===n);if(d)return pdCanon(d.id);
  const g=GROUPS.find(x=>x.label.toLowerCase()===n);if(g)return pdCanon(grpDepts(g.id)[0]);
  const alias={'installation':'install','installs':'install','installers':'install',
    'fabrication':'fab','shop':'fab','main shop':'fab','wood shop':'fab','woodshop':'fab',
    'office':'pm','project management':'pm','pm':'pm','administration':'pm','admin':'pm',
    'design':'td','drafting':'td','engineering':'td',
    'paint':'finish','painting':'finish',
    'metal':'metal','welding':'metal',
    'digital fabrication':'dfab','digital fab':'dfab','dfab':'dfab',
    'soft goods':'softgoods','sewing':'softgoods'};
  const hit=alias[n]||null;
  return hit?pdCanon(hit):null;
}
/* v1.43.0 (item 9a): the only Employee Contacts fields the import reads, by normalized name. The
   item request names just these columns, so Pay Type, PersonalEmail and the rest never reach the
   browser. */
const EC_MAP={name:['employeename','title','name'],status:['status','employmentstatus'],email:['email','workemail'],
  phone:['primaryphone','phone','mobilephone'],title:['currenttitle','jobtitle','position'],dept:['department']};
/* A column is known by its DISPLAY name when it has one: SharePoint keeps the internal name when a
   column is renamed, so a column created as "Email" and renamed "Personal Email" still has the
   internal name Email. Matching internals would select it and read it as the work email. */
const ecKey=c=>ecNorm(c.displayName||c.name);
function ecSelect(cols){
  const want=new Set(Object.values(EC_MAP).flat());
  return [...new Set(['Title',...(cols||[]).filter(c=>c&&c.name&&want.has(ecKey(c))).map(c=>c.name)])];
}
async function cdImportEC(btn){
  if(btn.disabled||IMPORTING)return;btn.disabled=true;IMPORTING=true;
  try{
    /* v1.43.0 (9a): the column definitions come FIRST — they're what the item request selects by.
       Without them nothing is fetched: never fall back to "every field". */
    let ecCols=null;
    try{ecCols=await store.columns('employeeContacts');}catch(e){}
    if(!ecCols){toast('Couldn\'t read the Employee Contacts column list, so nothing was imported — the import asks only for the fields it uses, and needs that list to name them.','err');return;}
    console.log('[import] Employee Contacts columns (internal → display):',
      ecCols.map(c=>c.name+' → '+c.displayName));
    const sel=ecSelect(ecCols);
    if(sel.length<2){toast('None of the expected columns (Status, Email, Primary Phone, Current Title, Department) are on Employee Contacts, so nothing was imported — the column list is in the browser console (F12).','err');return;}
    let rows;
    try{rows=await store.list('employeeContacts','fields(select='+sel.map(encodeURIComponent).join(',')+')');}
    catch(e){toast('Couldn\'t read the Employee Contacts list: '+store.explain(e),'err',null,e.message);return;}
    /* status only syncs once the owner-created column exists — probe, don't 400 */
    let hasStatus=false;
    try{const cols=await store.columns('staff');hasStatus=cols.some(c=>c.name==='status');}catch(e){}
    const disp={};for(const c of ecCols)if(c.name&&c.displayName)disp[ecNorm(c.name)]=ecNorm(c.displayName);
    const recs=rows.map(it=>{
      const m={};
      for(const k in it.fields){const nk=ecNorm(k),key=disp[nk]||nk;if(m[key]==null)m[key]=it.fields[k];}
      if(m.title==null&&it.fields.Title!=null)m.title=it.fields.Title; /* the built-in name column, whatever HR calls it */
      return{name:ecField(m,EC_MAP.name),
        status:ecField(m,EC_MAP.status),
        email:ecField(m,EC_MAP.email).toLowerCase(),
        phone:fmtPhone(ecField(m,EC_MAP.phone)), /* v1.43.0 (9c); the Mobile Phone fallback stays (9b deferred, owner 2026-10-08) */
        title:ecField(m,EC_MAP.title),
        dept:ecField(m,EC_MAP.dept)};
    }).filter(r=>r.name);
    if(!recs.length){toast('Employee Contacts returned no rows with a name — nothing to import.','err');return;}
    if(recs.every(r=>!r.title&&!r.phone&&!r.status&&!r.dept&&!r.email)){
      toast('Employee Contacts rows were found but none of the expected columns (Status, Email, Primary Phone, Current Title, Department) could be read — the column list is in the browser console (F12).','err');
      return;
    }
    const adds=[],updates=[],skipped=[],unmapped=[];
    for(const r of recs){
      const match=(r.email&&PEOPLE.find(p=>String(p.email||'').trim().toLowerCase()===r.email))
        ||PEOPLE.find(p=>p.name.trim().toLowerCase()===r.name.toLowerCase());
      if(!match){
        if(!/^active$/i.test(r.status)){skipped.push(r.name+' ('+(r.status||'no status')+')');continue;}
        const d=ecDept(r.dept);
        if(r.dept&&!d)unmapped.push(r.name+' — "'+r.dept+'"');
        adds.push({id:genId(),name:r.name,email:r.email,phone:r.phone,role:r.title,
          depts:d?[d]:[],ooo:[],...(hasStatus?{status:r.status}:{})});
      }else{
        const ch={};
        if(r.title&&r.title!==(match.role||''))ch.role=r.title;
        if(r.phone&&r.phone!==(match.phone||''))ch.phone=r.phone;
        if(r.email&&!String(match.email||'').trim())ch.email=r.email;
        if(hasStatus&&r.status&&r.status!==(match.status||''))ch.status=r.status;
        if(!(match.depts||[]).length){const d=ecDept(r.dept);
          if(d)ch.depts=[d];else if(r.dept)unmapped.push(r.name+' — "'+r.dept+'"');}
        if(Object.keys(ch).length)updates.push({id:match.id,name:match.name,ch});
      }
    }
    console.log('[import] Employee Contacts →',{adds,updates,skipped,unmapped});
    if(!adds.length&&!updates.length){toast('The roster already mirrors Employee Contacts — nothing to change. (Row-by-row detail is in the browser console — F12.)');return;}
    const cap=(a,n)=>a.slice(0,n).join('\n  ')+(a.length>n?'\n  …and '+(a.length-n)+' more':'');
    const msg='Mirror Employee Contacts into the roster?\n\n'
      +(adds.length?'ADD '+adds.length+' active employee'+(adds.length===1?'':'s')+':\n  '+cap(adds.map(a=>a.name+(a.role?' — '+a.role:'')),12)+'\n\n':'')
      +(updates.length?'UPDATE '+updates.length+' (title / phone / status from HR):\n  '+cap(updates.map(u=>u.name+' ('+Object.keys(u.ch).join(', ')+')'),12)+'\n\n':'')
      +(skipped.length?'Skipped (not Active on the HR list): '+skipped.length+'\n':'')
      +(unmapped.length?'Department not recognized (left for you to set):\n  '+cap(unmapped,8)+'\n':'')
      +(hasStatus?'':'\nNote: employment status will sync once the status column exists on ShopTimeline_Staff.\n')
      +'\nThe Employee Contacts list itself is never changed. Full detail is in the console.';
    if(!confirm(msg))return;
    const upById=new Map(updates.map(u=>[u.id,u.ch]));
    CD_SEL=null;
    savePeople([...PEOPLE.map(p=>upById.has(p.id)?{...p,...upById.get(p.id)}:p),...adds]);
    toast('Imported from Employee Contacts: '+adds.length+' added, '+updates.length+' updated.');
  }finally{IMPORTING=false;btn.disabled=false;const b=document.getElementById('cd-import');if(b)b.disabled=false;}
}

/* ===================== THE PHONE TIDY (v1.43.0, item 9c, owner 2026-10-08) =====================
   fieldsToPerson shows every number in the one format at once, but a row is only rewritten when
   it's saved. The one-time tidy rewrites the phone column only, on the rows not yet in the one
   format. One confirm; when it's done the button has nothing left to count and goes away. */
function phoneUntidy(){return Object.keys(RAW_PHONE).filter(id=>SPIDS[id]&&RAW_PHONE[id]&&fmtPhone(RAW_PHONE[id])!==RAW_PHONE[id]);}
async function cdTidyPhones(btn){
  const ids=phoneUntidy();if(!ids.length||btn.disabled)return;
  if(!confirm('Rewrite '+ids.length+' phone number'+(ids.length===1?'':'s')+' on the ShopTimeline_Staff list in the one format (555-555-5555)?\n\nOnly the phone column changes, and only on those rows. The numbers already show this way in the app.'))return;
  btn.disabled=true;setSync('busy');
  const errs=[];let n=0;
  for(const id of ids){const f=fmtPhone(RAW_PHONE[id]);
    try{await store.update('staff',SPIDS[id],{phone:f});RAW_PHONE[id]=f;n++;}
    catch(e){errs.push(((PEOPLE.find(p=>p.id===id)||{}).name||id)+': '+((e&&e.message)||e));}}
  setSync(errs.length?'err':'ok',errs.length?'phones not all tidied':'synced '+stamp());
  if(errs.length)toast('Tidied '+n+' of '+ids.length+' phone numbers — '+errs.length+' didn\'t save. Press the button again to retry them.','err',null,errs.join('\n'));
  else toast('Tidied '+n+' phone number'+(n===1?'':'s')+' on the list.');
  paint();
}

/* ===================== TEAM MEMBERSHIP (5b) =====================
   The editor suggests names from the members of the company Team; picking one fills the email
   that drives the identity chain. The Team is the menu, the Staff list stays the roster —
   membership is read, never synced. TeamMember.Read.All rides its OWN silent token request, so
   missing consent degrades this feature alone (free-text entry) and can't break sign-in. */
const TEAM_GROUP_ID='e434fc35-f2be-4dde-a258-2c23d94b5f9e';
let TM_MEMBERS=null;   /* null = not loaded yet (retry on next open) */
async function loadTeamMembers(){
  if(TM_MEMBERS!==null)return TM_MEMBERS;
  const out=[];
  try{
    const ms=await gpageAll('https://graph.microsoft.com/v1.0/teams/'+TEAM_GROUP_ID+'/members?$top=100',['TeamMember.Read.All']);
    for(const m of ms)if(m.displayName)out.push({name:m.displayName,email:String(m.email||'').toLowerCase(),userId:m.userId||''});
    out.sort((a,b)=>a.name.localeCompare(b.name));

  }catch(e){
    console.log('Team membership not reachable — the name box stays free-text.',(e&&e.message)||'');
    return [];

}
/* Fill the datalist, and backfill the open editor's email where its name matches exactly ONE
   member (ambiguous names stay untouched; the pick is visible before Save). */
function cdApplyTeam(ms){
  if(!ms||!ms.length)return;
  const dl=document.getElementById('cd-dl');
  if(dl)dl.innerHTML=ms.map(m=>'<option value="'+esc(m.name)+'"'+(m.email?' label="'+esc(m.email)+'"':'')+'>').join('');
  if(CD_EDIT&&!CD_EDIT.email){
    const hits=ms.filter(m=>m.email&&m.name.toLowerCase()===String(CD_EDIT.name||'').trim().toLowerCase());
    if(hits.length===1){CD_EDIT.email=hits[0].email;
      const em=document.getElementById('cde-email');if(em)em.value=hits[0].email;}
  }
}

/* ===================== PANE AND COLUMN SIZES (v1.17.0, v1.26.3) ===================== */
/* Remembered per browser, under Timeline's keys, so the sizes people set there carry over. */
let CD_LISTW=null,CD_COLW=null;
try{CD_LISTW=parseInt(localStorage.getItem('shopTimelineCdListW'),10)||null;
    CD_COLW=JSON.parse(localStorage.getItem('shopTimelineCdColW2')||'null');}catch(e){}
function cdApplySizes(){
  const list=document.querySelector('.cd-list');if(!list)return;
  if(CD_LISTW){list.style.width=CD_LISTW+'px';list.style.maxWidth='none';}
  if(CD_COLW)CD_COLW.forEach((w,i)=>{if(w)list.style.setProperty('--cdc'+(i+1),w+'px');});
  /* a column nobody pinned fits its content on every paint; pinned ones never move */
  for(let i=0;i<9;i++)if(!(CD_COLW&&CD_COLW[i]))cdFitCol(i,false);
  cdGripSync();
}
/* Fit column i to its widest header or cell text, capped. Measures real layout — with no layout
   (jsdom) it reads 0 and leaves the stylesheet default alone. */
const CD_COLCAP=280;
function cdFitCol(i,persist){
  const list=document.querySelector('.cd-list');if(!list)return;
  const cells=document.querySelectorAll('.cd-cols>span:nth-child('+(i+1)+'),.cd-row.pp7>:nth-child('+(i+1)+')');
  const w=Math.max(0,...[...cells].map(c=>c.scrollWidth));if(!w)return;
  const px=Math.min(CD_COLCAP,Math.max(36,w+2));
  list.style.setProperty('--cdc'+(i+1),px+'px');
  if(persist){CD_COLW=CD_COLW||[];CD_COLW[i]=px;try{localStorage.setItem('shopTimelineCdColW2',JSON.stringify(CD_COLW));}catch(e){}}
  cdGripSync();
}
function cdGripSync(){
  const hdr=document.querySelector('.cd-cols');if(!hdr)return;
  const sps=[...hdr.children].filter(el=>el.tagName==='SPAN');
  [...hdr.querySelectorAll('.cd-grip')].forEach((g,i)=>{
    const sp=sps[i];if(sp)g.style.left=(sp.offsetLeft+sp.offsetWidth-4)+'px';});
}
function cdColDrag(e,sp,i){
  e.preventDefault();
  const list=document.querySelector('.cd-list');if(!list)return;
  const w0=sp.offsetWidth,x0=e.clientX;
  const mv=ev=>{const w=Math.max(36,w0+ev.clientX-x0);
    CD_COLW=CD_COLW||[];CD_COLW[i]=w;list.style.setProperty('--cdc'+(i+1),w+'px');cdGripSync();};
  const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);
    try{localStorage.setItem('shopTimelineCdColW2',JSON.stringify(CD_COLW));}catch(err){}};
  document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
}
function cdSplitDrag(e){
  e.preventDefault();
  const list=document.querySelector('.cd-list');if(!list)return;
  const body=list.parentElement,x0=e.clientX,w0=list.getBoundingClientRect().width;
  const mv=ev=>{CD_LISTW=Math.round(Math.max(320,Math.min(body.clientWidth-280,w0+ev.clientX-x0)));
    list.style.width=CD_LISTW+'px';list.style.maxWidth='none';
    cdGripSync();};
  const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);
    try{localStorage.setItem('shopTimelineCdListW',String(CD_LISTW));}catch(err){}};
  document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
}

function cdPaintRows(){
  const box=document.getElementById('cd-rows-in');if(!box)return;

  const rows=[...PEOPLE].sort((a,b)=>a.name.localeCompare(b.name))
   .filter(p=>CD_DEPT==='all'||(p.depts||[]).map(pdCanon).includes(CD_DEPT))
   /* v1.17.0: the permission slice — admins include developers; viewer = no admin flag */
   .filter(p=>CD_PF==='all'||!permsLive()
     ||(CD_PF==='admin'?p.admin:CD_PF==='dev'?p.developer:CD_PF==='fb'?p.feedbackRecipient:!p.admin))
   .filter(p=>!qq||[p.name,p.role,p.email,p.phone,p.ext].some(v=>String(v||'').toLowerCase().includes(qq))
     ||(qq.replace(/\D/g,'').length>=3&&String(p.phone||'').replace(/\D/g,'').includes(qq.replace(/\D/g,'')))) /* v1.43.0 (9c): a number finds its person however it's typed */

    const t=fmtDate(today());
    const oooNow=(r.ooo||[]).some(o=>o.start&&o.end&&o.start<=t&&t<=o.end);
    const a=document.getElementById('cde-av-a'),u=document.getElementById('cde-av-u'),o=document.getElementById('cde-av-o');
    if(!a)return;
    if(oooNow){o.checked=true;a.checked=false;u.checked=false;}
    else{o.checked=false;(r.availability==='unavailable'?u:a).checked=true;}
  };
  const paintOoo=()=>{
    const box=document.getElementById('cde-ooo');box.innerHTML='';
    (r.ooo||[]).forEach((o,oi)=>{
      const row=document.createElement('div');row.className='cd-ooo-row';
      const s=document.createElement('input');s.type='date';s.value=o.start||'';s.setAttribute('aria-label','First day out');s.addEventListener('change',()=>{o.start=s.value;avSync();});
      const e=document.createElement('input');e.type='date';e.value=o.end||'';e.setAttribute('aria-label','Last day out');e.addEventListener('change',()=>{o.end=e.value;avSync();});
      const nt=document.createElement('input');nt.type='text';nt.placeholder='note (optional)';nt.setAttribute('aria-label','Note');nt.value=o.note||'';nt.addEventListener('input',()=>{o.note=nt.value;});
      const x=document.createElement('button');x.className='tn-x';x.textContent='✕';x.title='Remove this range';x.setAttribute('aria-label','Remove this range');
      x.addEventListener('click',()=>{r.ooo.splice(oi,1);paintOoo();avSync();});
      row.appendChild(s);row.appendChild(e);row.appendChild(nt);row.appendChild(x);
      box.appendChild(row);
    });
  };
  paintOoo();
  avSync();
  for(const id of['cde-av-a','cde-av-u']){
    const elx=document.getElementById(id);
    elx.addEventListener('change',()=>{if(elx.checked)r.availability=elx.value;});
  }
  const ad=document.getElementById('cde-admin');
  if(ad){ad.checked=!!r.admin;ad.addEventListener('change',()=>{r.admin=ad.checked;});}
  const fb=document.getElementById('cde-fbr');
  if(fb){fb.checked=!!r.feedbackRecipient;fb.addEventListener('change',()=>{r.feedbackRecipient=fb.checked;});}
  const dv=document.getElementById('cde-driver');
  if(dv){dv.checked=!!r.driver;dv.addEventListener('change',()=>{r.driver=dv.checked;});}
  document.getElementById('cde-ooo-add').addEventListener('click',()=>{r.ooo=r.ooo||[];r.ooo.push({id:genId(),start:'',end:'',note:''});paintOoo();});
  document.getElementById('cde-cancel').addEventListener('click',()=>{CD_EDIT=null;cdPaintDetail();});
  document.getElementById('cde-save').addEventListener('click',cdSavePerson);
  const del=document.getElementById('cde-del');
  if(del)del.addEventListener('click',cdRemovePerson);
  /* v1.15.0: the merge flow — the button reveals a picker of the other people */
  const mg=document.getElementById('cde-merge');
  if(mg)mg.addEventListener('click',()=>{
    const ui=document.getElementById('cde-merge-ui'),sel=document.getElementById('cde-merge-sel');
    if(!ui.classList.contains('hidden')){ui.classList.add('hidden');return;}
    sel.innerHTML='<option value="">Fold in which duplicate?</option>'
      +PEOPLE.filter(p=>p.id!==r.id).sort((a,b)=>a.name.localeCompare(b.name))
        .map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>').join('');
    ui.classList.remove('hidden');
  });
  const mgo=document.getElementById('cde-merge-go');
  if(mgo)mgo.addEventListener('click',()=>{
    const id=document.getElementById('cde-merge-sel').value;
    if(id)return cdMergePerson(r.id,id);
  });
}

function cdSavePerson(){
  const r=CD_EDIT;if(!r)return;
  const per={id:r.id,name:(r.name||'').trim(),email:(r.email||'').trim(),phone:fmtPhone(r.phone),role:(r.role||'').trim(),
    ext:r.ext==null?null:String(r.ext).trim(),
    depts:[...new Set((r.depts||[]).map(pdCanon))], /* v1.14.0: saves heal legacy machine-level ids */
    ooo:(r.ooo||[]).filter(o=>o.start&&o.end).map(o=>o.end>=o.start?o:{...o,start:o.end,end:o.start}),
    /* v1.8.0: the flags ride through every save (tristate — null means the row never carried the
       column and personToFields omits it). developer and personalNotes ride along too — the editor
       never touches either, but a save here must not strip them off the row. */
    admin:r.admin==null?null:!!r.admin,
    developer:!!r.developer,
    personalNotes:r.personalNotes==null?null:r.personalNotes,
    status:r.status==null?null:r.status,
    nickname:r.nickname==null?null:String(r.nickname).trim(),
    driver:r.driver==null?null:!!r.driver,
    availability:r.availability==null?null:r.availability,
    schedule:r.schedule==null?null:{days:(r.schedule.days||[]).map(Number).sort(),start:r.schedule.start||'',end:r.schedule.end||''},
    freelance:r.freelance==null?null:!!r.freelance,
    listeningTo:r.listeningTo==null?null:r.listeningTo,
    listeningLink:r.listeningLink==null?null:r.listeningLink,
    listeningVerb:r.listeningVerb==null?null:r.listeningVerb,
    listeningShow:r.listeningShow==null?null:!!r.listeningShow,
    feedbackRecipient:r.feedbackRecipient==null?null:!!r.feedbackRecipient};
  if(!per.name){toast('Give the person a name first.','err');return;}
  if(PEOPLE.some(x=>x.id!==per.id&&x.name.trim().toLowerCase()===per.name.toLowerCase())){
    toast('Two people share the name "'+per.name+'" — please make names unique.','err');return;}
  /* v1.8.0: the last admin can't be demoted — that would lock the whole app read-only. */
  {const live=PEOPLE.find(x=>x.id===per.id);
   if(live&&live.admin&&!per.admin&&!PEOPLE.some(x=>x.id!==per.id&&x.admin)){
     toast('You can\'t remove the last admin — make someone else an admin first.','err');return;}}
  const list=PEOPLE.some(x=>x.id===per.id)?PEOPLE.map(x=>x.id===per.id?per:x):[...PEOPLE,per];
  CD_EDIT=null;CD_SEL=per.id;
  savePeople(list);
  toast(per.name+' saved');
}
function cdRemovePerson(){
  const r=CD_EDIT;if(!r||r._new)return;
  const live=PEOPLE.find(x=>x.id===r.id);if(!live)return;
  const asn=cdAssignments(live.name);
  const warn=(!asn?'Couldn\'t read the projects, so '+live.name+'\'s phases weren\'t counted. Bars that name them keep the stored name.\n\n'
    :asn.phases
    ? live.name+' is on '+asn.phases+' phase'+(asn.phases===1?'':'s')+' across '+asn.projects+' project'+(asn.projects===1?'':'s')+'.\nThose bars keep the stored name but stop matching a roster person.\n\n'
    : '')+'Remove '+live.name+' from the roster?';
  if(!confirm(warn))return;
  CD_EDIT=null;CD_SEL=null;
  savePeople(PEOPLE.filter(x=>x.id!==r.id));
  toast(live.name+' removed');
}

/* ===================== HOOKS FOR common/ ===================== */
/* The update check's three (item 85 (b)): a reload never costs an edit or a save. */
function updWhyNot(){
  if(SAVING)return 'a save is still going — try again in a moment';
  if(PENDING||RETRY.length)return 'a save hasn’t reached SharePoint yet — click the sync pill to retry, then reload';
  if(CD_EDIT)return 'finish or cancel the record you’re editing first';
  return '';
}
function updBusy(){return !!updWhyNot();}
function updGo(){location.reload();}

/* ===================== WIRING ===================== */
document.getElementById('sync-pill').addEventListener('click',retryPending);
document.getElementById('tb-rev').textContent='v'+APP_VER; /* item 101: the version, as in Timeline's header */
document.getElementById('auth-signin').addEventListener('click',async()=>{
  const b=document.getElementById('auth-signin');b.disabled=true;
  try{await spLogin();document.getElementById('auth-overlay').classList.add('hidden');setSync('ok','synced '+stamp());retryPending();}
  catch(e){console.error(e);toast('Couldn\'t sign in: '+store.explain(e),'err',null,String(e&&e.message));}
  finally{b.disabled=false;}
});
const appsBtn=document.getElementById('btn-apps'),appsMenu_=document.getElementById('apps-menu');
appsMenu(appsMenu_,'People','../');
const appsOpen=on=>{appsMenu_.classList.toggle('hidden',!on);appsBtn.setAttribute('aria-expanded',String(on));};
appsBtn.addEventListener('click',ev=>{ev.stopPropagation();appsOpen(appsMenu_.classList.contains('hidden'));});
document.addEventListener('click',ev=>{if(!ev.target.closest||!ev.target.closest('.apps-wrap'))appsOpen(false);colMenuClose();});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){
    if(!appsMenu_.classList.contains('hidden')){appsOpen(false);appsBtn.focus();return;}
    if(colMenuClose())return;
    const typing=ev.target.matches&&ev.target.matches('input,select,textarea');
    if(typing){ev.target.blur();return;}
    if(CD_EDIT&&confirm('Discard the changes to this record?')){CD_EDIT=null;cdPaintDetail();}
    return;
  }
  /* v1.17.0 (owner): ↑↓ walk the index selection */
  if((ev.key==='ArrowDown'||ev.key==='ArrowUp')&&!CD_EDIT&&!(ev.target.matches&&ev.target.matches('input,select,textarea'))){
    const rows=[...document.querySelectorAll('#cd-rows .cd-row')];
    if(!rows.length)return;
    const i=rows.findIndex(r=>r.dataset.id===String(CD_SEL));
    rows[ev.key==='ArrowDown'?Math.min(rows.length-1,i+1):Math.max(0,i<0?0:i-1)].click();
    const sel=document.querySelector('#cd-rows .cd-row.sel');
    if(sel&&sel.scrollIntoView)sel.scrollIntoView({block:'nearest'});
    ev.preventDefault();
  }
});
/* An edit, a save in flight or a parked one: the browser's own "leave site?" warning. */
window.addEventListener('beforeunload',ev=>{if(SAVING||PENDING||RETRY.length||CD_EDIT){ev.preventDefault();ev.returnValue='';}});

(async()=>{
  try{
    setSync('busy','signing in…');
    await store.signIn();
    setSync('busy','loading…');
    await loadAll();
    LOADED=true;
    setSync('ok','synced '+stamp());
  }catch(e){
    console.error(e);
    setSync('err','offline');
    toast('Couldn\'t sign in or reach SharePoint: '+store.explain(e),'err',null,String(e&&e.message));
    M().innerHTML='<div class="note"><h2>Couldn\'t reach SharePoint.</h2><p>'+esc(store.explain(e))+'</p>'
      +'<button class="btn primary" id="retry">Try again</button></div>';
    document.getElementById('retry').addEventListener('click',()=>location.reload());
  }
  paint();
  updWatch(); /* the update check (common/) */
  /* Other people's changes: the roster every 90 s; projects too when the tab comes back into
     view (the phase counts change in Timeline). Never mid-edit or mid-save. */
  const refresh=async withProjects=>{
    if(!LOADED||!store.who()||updBusy())return;
    try{const g=GEN,[s]=await Promise.all([readStaff(),withProjects?loadProjects():null]);
      if(g!==GEN||updBusy())return;
      const changed=JSON.stringify(s.people)!==JSON.stringify(PEOPLE)||withProjects;
      PEOPLE=s.people;SPIDS=s.ids;RAW_PHONE=s.raw;if(withProjects)PROJ_OK=true;
      if(changed)paint();}catch(e){}
  };
  setInterval(()=>{if(!document.hidden)refresh(false);},POLL_MS);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh(true);});
})();
</script>
