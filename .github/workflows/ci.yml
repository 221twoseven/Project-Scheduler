name: CI

# Run the Timeline regression suites on every PR into the working and production
# branches, so a broken build is caught before it reaches Pages. Pull requests only
# (owner, 2026-10-09): the PR run already tests the merged result, so a second run
# on the push after the merge was dropped. Both branches take changes only by PR.
# The second run against reference/Timeline_50.html was dropped too (owner, 2026-10-14):
# the REV50 baseline stopped being a goal, and nearly every suite skipped on it.
on:
  pull_request:
    branches: [main, development]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run regression suites against timeline/index.html (and the Systems page)
        run: npm test

  # The Systems API's Azure resources (infra/, item 51): compile and lint the Bicep.
  # Nothing signs in to Azure and nothing is deployed here.
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and lint the Bicep
        env:
          SQL_ADMIN_NAME: ci-placeholder
          SQL_ADMIN_OBJECT_ID: 00000000-0000-0000-0000-000000000000
        run: |
          az bicep install
          az bicep lint --file infra/main.bicep
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build-params --file infra/staging.bicepparam --stdout > /dev/null
