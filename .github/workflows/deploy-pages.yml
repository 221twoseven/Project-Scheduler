name: Deploy Pages

# One Pages site, three versions:
#   /          <- main         (production)
#   /preview/  <- development  (shareable preview for testing)
#   /sandbox/  <- sandbox      (the collaborator's own copy, can't reach main)
# Every deploy rebuilds the WHOLE site from all three branches, because the Pages
# artifact fully replaces the live site each run. Triggered by pushes to any of
# them, so this workflow must exist on ALL THREE branches, identical — otherwise
# a push to a branch whose workflow omits a subpath would wipe that subpath.
on:
  push:
    branches: [main, development, sandbox]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # ONLY the files listed below are published. The rest of the repo (docs/,
      # tests/, reference/, ...) stays off the public site on purpose. If the app
      # ever gains a new local asset (image, CSS file, favicon, script), add it to
      # ALL THREE sparse-checkout lists — the guard step below fails the deploy if
      # index.html references a file that would be missing from the site.
      - name: Checkout main into site root (production)
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          sparse-checkout: |
            index.html
            msal-browser.min.js
            fonts/BrNStdBd.otf
          sparse-checkout-cone-mode: false

      - name: Checkout development into /preview (shareable preview)
        uses: actions/checkout@v4
        with:
          ref: development
          path: site/preview
          sparse-checkout: |
            index.html
            msal-browser.min.js
            fonts/BrNStdBd.otf
          sparse-checkout-cone-mode: false

      - name: Checkout sandbox into /sandbox (collaborator copy)
        uses: actions/checkout@v4
        with:
          ref: sandbox
          path: site/sandbox
          sparse-checkout: |
            index.html
            msal-browser.min.js
            fonts/BrNStdBd.otf
          sparse-checkout-cone-mode: false

      - name: Drop nested .git so it isn't published
        run: rm -rf site/.git site/preview/.git site/sandbox/.git

      - name: Guard — every local file the app references must be in the deploy
        run: |
          for d in site site/preview site/sandbox; do
            grep -oE '(src|href)="[^"]+"' "$d/index.html" \
              | sed -E 's/^(src|href)="//; s/"$//' \
              | grep -vE '^(https?:|//|#|data:|mailto:|javascript:)' \
              | while read -r f; do
                  if [ ! -f "$d/$f" ]; then
                    echo "::error::$d/index.html references '$f' but it is not deployed — add it to the sparse-checkout lists in deploy-pages.yml"
                    exit 1
                  fi
                done
          done
          echo "All referenced local assets are present."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
